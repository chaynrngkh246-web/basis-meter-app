<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#2c4685">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="มิเตอร์ BISB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>บันทึกมิเตอร์ BISB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#eef1f5; --panel:#ffffff; --panel-2:#f6f8fb;
  --ink:#161b23; --ink-2:#4d5665; --ink-3:#7d8797;
  --line:#dce1e9; --line-2:#c6cedb;
  --elec:#a45c10; --elec-bg:#fdf1e0;
  --water:#0c6883; --water-bg:#e3f2f7;
  --action:#2c4685; --action-ink:#ffffff; --action-soft:#e6ecf8;
  --ok:#236844; --ok-bg:#e1f1e8;
  --warn:#9b3a1e; --warn-bg:#fbede8;
  --shadow:0 1px 2px rgba(20,28,42,.06),0 4px 14px rgba(20,28,42,.05);
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0e1218; --panel:#171d26; --panel-2:#1e2530;
    --ink:#e6ebf2; --ink-2:#a3aebd; --ink-3:#778394;
    --line:#28313d; --line-2:#374252;
    --elec:#eba85a; --elec-bg:#2d2415;
    --water:#4fb6d3; --water-bg:#132a33;
    --action:#8ba6e8; --action-ink:#0e1218; --action-soft:#1d2740;
    --ok:#6ecf9b; --ok-bg:#14291f;
    --warn:#f0997c; --warn-bg:#2e1a15;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0e1218; --panel:#171d26; --panel-2:#1e2530;
  --ink:#e6ebf2; --ink-2:#a3aebd; --ink-3:#778394;
  --line:#28313d; --line-2:#374252;
  --elec:#eba85a; --elec-bg:#2d2415;
  --water:#4fb6d3; --water-bg:#132a33;
  --action:#8ba6e8; --action-ink:#0e1218; --action-soft:#1d2740;
  --ok:#6ecf9b; --ok-bg:#14291f;
  --warn:#f0997c; --warn-bg:#2e1a15;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans Thai","Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3{font-family:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;font-weight:600;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--action);outline-offset:2px;border-radius:6px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.wrap{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 15px 10px;display:flex;align-items:center;gap:10px;
}
.topbar h1{font-size:16px;letter-spacing:-.2px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:11px;color:var(--ink-3);font-weight:400;letter-spacing:.3px}
.iconbtn{background:none;border:1px solid var(--line);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:active{background:var(--panel-2)}
.iconbtn svg{width:19px;height:19px;stroke-width:1.9}
.who{font-size:11px;font-weight:600;background:var(--action-soft);color:var(--action);border:none;border-radius:999px;padding:6px 11px;flex:none;max-width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;padding:15px 15px 96px}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs-inner.tabs5{grid-template-columns:repeat(5,1fr)}
.tabs5 .tab{font-size:10px}
.tab{background:none;border:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--ink-3);border-top:2px solid transparent;margin-top:-1px}
.tab svg{width:21px;height:21px;stroke-width:1.7}
.tab[aria-current="page"]{color:var(--action);border-top-color:var(--action)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}

.daycard{padding:14px 15px 15px}
.daycard .d1{font-size:11px;color:var(--ink-3);letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.daycard .d2{font-family:"Bai Jamjuree",sans-serif;font-size:21px;font-weight:600;letter-spacing:-.3px;margin-top:1px}
.meter{height:7px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;margin-top:11px}
.meter i{display:block;height:100%;background:var(--ok);transition:width .35s ease}
.meterlabel{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-top:7px}
.meterlabel b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink)}

/* today's net usage — the number the team was doing on paper */
.totals{display:grid;gap:9px;grid-template-columns:1fr 1fr;margin-top:12px}
.totbox{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:var(--panel-2)}
.totbox .tl{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.totbox .tl svg{width:12px;height:12px;stroke-width:2.3}
.totbox.e .tl{color:var(--elec)} .totbox.w .tl{color:var(--water)}
.totbox .tv{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.3px}
.totbox .tu{font-size:10.5px;color:var(--ink-3);font-weight:500}

.prow{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;box-shadow:var(--shadow)}
.prow:active{background:var(--panel-2)}
.stripe{width:4px;align-self:stretch;border-radius:99px;flex:none;background:var(--line-2)}
.stripe.done{background:var(--ok)}
.pmain{flex:1;min-width:0}
.pname{font-weight:600;font-size:14.5px;letter-spacing:-.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;letter-spacing:.2px;display:inline-flex;align-items:center;gap:3px}
.chip svg{width:10px;height:10px;stroke-width:2.4}
.chip.e{background:var(--elec-bg);color:var(--elec)}
.chip.w{background:var(--water-bg);color:var(--water)}
.chip.off{background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line)}
.chip b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.pend{flex:none;text-align:right}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.part{background:var(--elec-bg);color:var(--elec)}
.pill.todo{background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line-2)}

.mcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.mcard>header{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.mcard>header .nm{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard>header .un{font-size:11px;color:var(--ink-3);font-weight:600;flex:none}
.dot{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none}
.dot svg{width:13px;height:13px;stroke-width:2.1}
.dot.e{background:var(--elec-bg);color:var(--elec)}
.dot.w{background:var(--water-bg);color:var(--water)}
.reg{padding:11px 12px 9px}
.reg input{
  width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;
  box-shadow:inset 0 2px 4px rgba(20,28,42,.07);padding:9px 11px;
  font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;letter-spacing:.8px;
  font-variant-numeric:tabular-nums;
}
.reg input::placeholder{color:var(--line-2)}
.reg input:focus{outline:none;border-color:var(--action)}
.mfoot{display:flex;gap:12px;padding:7px 12px 10px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.mfoot b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600}
.mfoot .u b{color:var(--ok)}
.mwarn{padding:0 12px 10px;font-size:11.5px;color:var(--warn);line-height:1.45}

.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shot{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot button{position:absolute;top:4px;right:4px;width:23px;height:23px;border-radius:99px;border:none;background:rgba(10,14,20,.72);color:#fff;display:grid;place-items:center;padding:0}
.shot button svg{width:12px;height:12px;stroke-width:2.4}
.addshot{aspect-ratio:1;border-radius:11px;border:1.5px dashed var(--line-2);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--ink-3);font-size:11px;font-weight:500}
.addshot svg{width:22px;height:22px;stroke-width:1.7}
.addshot:active{background:var(--panel-2)}

.txt{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14px;resize:none}
.txt:focus{outline:none;border-color:var(--action)}

.dock{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:11px 15px calc(env(safe-area-inset-bottom) + 11px)}
.dock-inner{max-width:480px;margin:0 auto;display:flex;gap:9px}
.btn{border:1px solid transparent;border-radius:11px;padding:13px 16px;font-weight:600;font-size:15px;background:var(--action);color:var(--action-ink);flex:1;letter-spacing:-.1px}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--panel);color:var(--ink-2);border-color:var(--line-2);flex:none}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:9px}
.btn.block{width:100%;flex:none}

.monthnav{display:flex;align-items:center;gap:8px}
.monthnav .lbl{flex:1;text-align:center;font-family:"Bai Jamjuree",sans-serif;font-weight:600;font-size:15px}
.led{overflow:hidden}
.ledhead{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.ledsub{display:flex;align-items:center;gap:7px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.ledsub .nm{flex:1;min-width:0;font-size:12px;font-weight:600;color:var(--ink-2)}
.ledsub .tt{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.ledrow{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 20px;border-bottom:1px solid var(--line);font-size:12.5px}
.ledrow:last-child{border-bottom:none}
.ledrow .dt{width:60px;flex:none;color:var(--ink-2)}
.ledrow .by{flex:1;min-width:0;font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ledrow .vv{text-align:right;flex:none;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.ledrow .vv b{font-size:12.5px;font-weight:600}
.ledrow .vv i{font-style:normal;font-size:11px;color:var(--ok);margin-left:6px}
.thumb{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);flex:none;
  background:var(--panel-2);padding:0;position:relative;display:grid;place-items:center;color:var(--ink-3)}
.thumb svg{width:15px;height:15px;stroke-width:1.8}
.thumb .n{position:absolute;right:-4px;top:-5px;background:var(--action);color:var(--action-ink);
  font-size:9px;font-weight:600;line-height:1;padding:2px 4px;border-radius:99px}
.thumb:active{background:var(--line)}

table.sum{width:100%;border-collapse:collapse;font-size:13px}
table.sum th{text-align:left;font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.sum td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.sum td.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
table.sum tr:last-child td{border-bottom:none}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* the month log as a matrix — days down, meters across */
.gwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:72vh;border-radius:var(--radius)}
table.gt{border-collapse:separate;border-spacing:0;font-size:11.5px;background:var(--panel)}
table.gt th,table.gt td{padding:5px 8px;white-space:nowrap;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
table.gt thead th{position:sticky;top:0;z-index:2;background:var(--panel-2);font-size:9.5px;letter-spacing:.3px;
  text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:right;vertical-align:bottom}
table.gt thead th .pt{display:block;font-size:10.5px;text-transform:none;letter-spacing:0;color:var(--ink-2)}
table.gt .c0{position:sticky;left:0;z-index:1;background:var(--panel);text-align:left;min-width:76px;
  border-right:1px solid var(--line-2)}
table.gt thead .c0{z-index:3;background:var(--panel-2)}
table.gt td.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
table.gt td.z{color:var(--line-2)}
table.gt tr.blank .c0{color:var(--ink-3)}
table.gt .sum{background:var(--panel-2);font-weight:600}
table.gt tfoot td{position:sticky;bottom:0;background:var(--panel-2);font-weight:600;border-top:1px solid var(--line-2)}
table.gt tfoot .c0{z-index:3}

.ledrow{cursor:pointer}
.ledrow:active{background:var(--panel-2)}
.ledrow .go{flex:none;color:var(--line-2);display:flex}
.ledrow .go svg{width:15px;height:15px;stroke-width:2}
.daylink{background:none;border:none;padding:0;font:inherit;color:var(--action);text-align:left;
  text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--line-2)}
.dayhead{display:flex;align-items:center;gap:10px}
.dayhead>div{flex:1;min-width:0}
.iconbtn:disabled{opacity:.35}

.note{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.empty svg{width:38px;height:38px;stroke-width:1.4;color:var(--line-2);margin-bottom:10px}
.empty p{margin:0 0 14px;font-size:13.5px}
.banner{border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.55}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.info{background:var(--action-soft);color:var(--action)}
.seg{display:flex;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:4px}
.seg button{flex:1;border:none;background:none;border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--action);box-shadow:var(--shadow)}
.inp{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px}
.inp:focus{outline:none;border-color:var(--action)}
.flabel{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.rowline{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:none}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:99px;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.gate{max-width:420px;margin:0 auto;padding:26px 20px calc(env(safe-area-inset-bottom) + 26px);min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:15px}
.gate .mark{width:52px;height:52px;border-radius:14px;background:var(--action);color:var(--action-ink);display:grid;place-items:center;margin:0 auto}
.gate .mark svg{width:29px;height:29px;stroke-width:1.7}
.gate h2{font-size:20px;text-align:center;letter-spacing:-.3px}
.gate .sub{text-align:center;font-size:13px;color:var(--ink-3);margin-top:-7px}
.pinrow{display:flex;justify-content:center;gap:11px;margin:2px 0 4px}
.pindot{width:13px;height:13px;border-radius:99px;border:2px solid var(--line-2)}
.pindot.on{background:var(--action);border-color:var(--action)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{aspect-ratio:1.45;border:1px solid var(--line);background:var(--panel);border-radius:12px;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;box-shadow:var(--shadow)}
.pad button:active{background:var(--panel-2)}
.pad button.fn{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-3);box-shadow:none;background:none;border-color:transparent}
.picklist{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:11px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;font-weight:600;font-size:14.5px;box-shadow:var(--shadow)}
.pick:active{background:var(--panel-2)}
.av{width:33px;height:33px;border-radius:99px;background:var(--action-soft);color:var(--action);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.linkbox{font-family:"IBM Plex Mono",monospace;font-size:11px;word-break:break-all;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;max-height:110px;overflow:auto;line-height:1.5}

.lb{position:fixed;inset:0;z-index:60;background:rgba(8,11,16,.94);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.lb img{flex:1;min-height:0;width:100%;object-fit:contain}
.lb .lbbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#e6ebf2;font-size:13px}
.lb .lbbar button{background:none;border:1px solid rgba(230,235,242,.3);color:#e6ebf2;border-radius:8px;padding:6px 12px;font-size:13px}

/* ---------- the document handed to accounting ---------- */
#paperwrap{display:none}
body.printing #paperwrap{display:block}
body.printing .wrap{display:none}
.paperbar{
  position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 15px 10px;display:flex;gap:9px;align-items:center;
  max-width:820px;margin:0 auto;
}
.paperbar .t{flex:1;font-weight:600;font-size:14px}
.paperscroll{padding:15px;overflow-x:auto;background:var(--ground)}
.paper{
  width:794px;min-height:1123px;margin:0 auto;background:#fff;color:#14181f;
  padding:52px 56px 44px;box-shadow:0 4px 22px rgba(16,22,34,.14);
}
.paper *{color:inherit}
.ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #14181f;padding-bottom:13px}

/* ================= helpers ================= */
const $ = (s, r) => (r || document).querySelector(s);

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const rid = (p) => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);

const TH_S = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const TH_L = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const dstr = (d) => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const today = () => dstr(new Date());
const monthOf = (ds) => ds.slice(0, 7);
const thisMonth = () => monthOf(today());
function thDate(ds) { const [y,m,d] = ds.split("-").map(Number); return d + " " + TH_S[m-1] + " " + (y+543); }
function thMonth(ms) { const [y,m] = ms.split("-").map(Number); return TH_L[m-1] + " " + (y+543); }
function shiftMonth(ms, k) { const [y,m] = ms.split("-").map(Number); const d = new Date(y, m-1+k, 1);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1); }
const fmt = (n) => (n == null || Number.isNaN(n) ? "—" : Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 }));
/** meters read to 2 decimals; round every subtraction so accounting never sees 63.06000000005588 */
const r2 = (n) => Math.round(n * 100) / 100;

const ICON = {

const svg = (k, cls) => '<svg class="' + (cls||"") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[k] + "</svg>";

function toast(msg, bad) {
  const t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:80;background:" +
    (bad ? "var(--warn)" : "var(--ink)") + ";color:var(--ground);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;max-width:88%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)";
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2900);
}
async function sha(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
}

/* ================= state ================= */
const S = {
  db: null, ready: false, fatal: "",
  points: [], staff: [], months: {}, priors: {},
  me: null, view: "home", month: thisMonth(), photoCount: null,
  day: today(),   // the date the home screen and record screen are looking at
};
const LS_ME = "bisb-meter-who", LS_CFG = "bisb-meter-cfg";
function loadMe(){ try{ const v = JSON.parse(localStorage.getItem(LS_ME)||"null"); if(v&&v.id) S.me=v; }catch(e){} }
function saveMe(v){ S.me=v; try{ v?localStorage.setItem(LS_ME,JSON.stringify(v)):localStorage.removeItem(LS_ME);}catch(e){} }

const P_POINTS = "config/points", P_STAFF = "config/staff";
const M3 = "ลบ.ม.";
const ORG = "โรงเรียนนานาชาติเบซิส กรุงเทพฯ (BISB)";

/* the 10 rounds the team already photographs, from their LINE log */
const SEED = [
  { name: "Academic", meters: [["electric","ไฟฟ้า","kWh"], ["water","น้ำ",M3]] },
  { name: "Science and Canteen", meters: [["electric","ไฟฟ้า","kWh"], ["water","น้ำ",M3]] },
  { name: "Sport", meters: [["electric","ไฟฟ้า","kWh"], ["water","น้ำ",M3]] },
  { name: "Kinder", meters: [["electric","ไฟฟ้า","kWh"], ["water","น้ำ",M3]] },
  { name: "Arts and Coffee", meters: [["electric","ไฟฟ้า","kWh"], ["water","น้ำ",M3]] },
  { name: "MDB-EMDB and SOFT", meters: [["electric","ไฟฟ้า MDB","kWh"]] },
  { name: "MEA มิเตอร์การไฟฟ้า", meters: [["electric","MEA 010","kWh"], ["electric","MEA 011","kWh"], ["electric","MEA 012","kWh"], ["electric","MEA 031","kWh"]] },
  { name: "Pool & Swimming Pool System", meters: [["water","น้ำสระ",M3], ["electric","ไฟฟ้าระบบสระ","kWh"]] },
  { name: "บ่อบำบัด", meters: [["electric","ไฟฟ้าบ่อบำบัด","kWh"]] },
  { name: "Irrigation Water Meter", meters: [["water","น้ำรดน้ำต้นไม้",M3]] },
];
function seedPoints() {
  return SEED.map((s, i) => ({
    id: rid("p"), name: s.name, location: "", order: i, active: true,
    meters: s.meters.map(([t, l, u]) => ({ id: rid("m"), type: t, label: l, unit: u })),
  }));
}
const activeMeters = (p) => (p.meters || []).filter((m) => m.active !== false);

/* ================= firestore adapter =================
   Wraps Firestore in the small surface the app uses, so the data layer
   stays swappable and the view code never imports Firebase directly. */
function makeDb(fs) {
  const wrapDoc = (path) => ({
    get: async () => {
      const s = await getDoc(fsDoc(fs, path));
      return { id: s.id, exists: s.exists(), data: () => s.data() };
    },
    set: (d) => setDoc(fsDoc(fs, path), d),
    delete: () => deleteDoc(fsDoc(fs, path)),
    onSnapshot: (cb, err) => fsOnSnap(fsDoc(fs, path),
      (s) => cb({ id: s.id, exists: s.exists(), data: () => s.data() }),
      (e) => err && err(e)),
  });
  const wrapQuery = (path, parts) => ({
    where: (f, op, v) => wrapQuery(path, parts.concat([fsWhere(f, op, v)])),
    limit: (n) => wrapQuery(path, parts.concat([fsLimit(n)])),
    get: async () => {
      const s = await getDocs(fsQuery(fsCol(fs, path), ...parts));
      const docs = s.docs.map((d) => ({ id: d.id, exists: true, data: () => d.data() }));
      return { docs, size: docs.length, empty: !docs.length };
    },
    onSnapshot: (cb, err) => fsOnSnap(fsQuery(fsCol(fs, path), ...parts), (s) => {
      const docs = s.docs.map((d) => ({ id: d.id, exists: true, data: () => d.data() }));
      cb({ docs, size: docs.length, empty: !docs.length });
    }, (e) => err && err(e)),
  });
  return { doc: wrapDoc, collection: (p) => wrapQuery(p, []) };
}

function dbErr(e, fb) {
  const c = (e && e.code) || "";
  if (/permission-denied/.test(c)) return "ฐานข้อมูลไม่อนุญาต — ตรวจสอบกฎ (Rules) ใน Firebase ตามคู่มือ";
  if (/unavailable|network/.test(c)) return "เน็ตไม่ถึง ข้อมูลจะถูกส่งเองเมื่อสัญญาณกลับมา";
  if (/resource-exhausted|quota/.test(c)) return "โควตาฐานข้อมูลเต็มวันนี้ ลองใหม่พรุ่งนี้";
  if (/invalid-argument/.test(c)) return "ข้อมูลใหญ่เกินไป บันทึกไม่ได้";
  return fb || "เชื่อมต่อฐานข้อมูลไม่ได้ ลองใหม่อีกครั้ง";
}

async function loadMonth(m, force) {
  if (S.months[m] && !force) return S.months[m];
  const snap = await S.db.collection("readings").where("month", "==", m).get();
  const out = {};
  snap.docs.forEach((d) => { const v = d.data() || {}; if (v.pointId) out[v.pointId] = v.days || {}; });
  S.months[m] = out;
  return out;
}
async function prevFor(pid, mid, ds) {
  let m = monthOf(ds);
  for (let i = 0; i < 3; i++) {
    const days = (await loadMonth(m))[pid] || {};
    for (const k of Object.keys(days).sort().reverse()) {
      const date = m + "-" + k;
      if (date >= ds) continue;
      const v = (days[k].vals || {})[mid];
      if (v != null) return { date: date, v: v };
    }
    m = shiftMonth(m, -1);
  }
  return null;
}
async function writeEntry(pid, ds, entry) {
  const m = monthOf(ds);
  const ref = S.db.doc("readings/" + pid + "__" + m);
  const snap = await ref.get();
  const days = snap.exists ? { ...((snap.data() || {}).days || {}) } : {};
  days[ds.slice(8, 10)] = entry;
  await ref.set({ pointId: pid, month: m, days: days });
  if (!S.months[m]) S.months[m] = {};
  S.months[m][pid] = days;
}

/** drop one day's entry for a point, and the photos that belonged to it */
async function deleteEntry(pid, ds) {
  const m = monthOf(ds);
  const ref = S.db.doc("readings/" + pid + "__" + m);
  const snap = await ref.get();
  if (!snap.exists) return;
  const data = snap.data() || {};
  const days = { ...(data.days || {}) };
  const gone = (days[ds.slice(8, 10)] || {}).photos || [];
  delete days[ds.slice(8, 10)];
  await ref.set({ pointId: pid, month: m, days: days });
  if (S.months[m]) S.months[m][pid] = days;
  for (const id of gone) { try { await S.db.doc("photos/" + id).delete(); } catch (e) {} }
}

/* ================= photos ================= */
const STEPS = [[1100,.62],[980,.55],[860,.5],[720,.45],[600,.4],[480,.34]];
const MAX_B64 = 700000; // Firestore caps a document at 1 MiB; leave generous headroom
async function shrink(file) {
  let src = null;
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch (e) { try { src = await createImageBitmap(file); } catch (e2) { src = null; } }
  if (!src) src = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i); i.onerror = () => rej(new Error("bad"));
    i.src = URL.createObjectURL(file);
  });
  const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight;
  if (!w0 || !h0) throw new Error("bad");
  const cv = document.createElement("canvas"), cx = cv.getContext("2d");
  let out = "";
  for (const [dim, q] of STEPS) {
    const sc = Math.min(1, dim / Math.max(w0, h0));
    cv.width = Math.max(1, Math.round(w0 * sc));
    cv.height = Math.max(1, Math.round(h0 * sc));
    cx.clearRect(0, 0, cv.width, cv.height);
    cx.drawImage(src, 0, 0, cv.width, cv.height);
    out = cv.toDataURL("image/jpeg", q);
    if (out.length <= MAX_B64) break;
  }
  if (src.close) src.close();
  return out;
}

/* ================= usage maths ================= */
function meterRows(pid, mid, days, prior) {
  let prev = prior;
  const out = [];
  Object.keys(days).sort().forEach((k) => {
    const v = (days[k].vals || {})[mid];
    if (v == null) return;
    out.push({ day: k, v: v, by: days[k].by, note: days[k].note, photos: days[k].photos || [],
      use: prev == null ? null : r2(Math.max(v - prev, 0)) });
    prev = v;
  });
  return out;
}
/** every meter's daily series for `month`, with the month's opening/closing values */
function monthSeries(month) {
  const md = S.months[month] || {};
  const priors = S.priors[month] || {};
  const out = [];
  S.points.slice().sort((a, b) => (a.order||0) - (b.order||0)).forEach((p) => {
    const days = md[p.id];
    if (!days) return;
    activeMeters(p).forEach((m) => {
      const prior = (priors[p.id] || {})[m.id];
      const rows = meterRows(p.id, m.id, days, prior == null ? null : prior);
      if (!rows.length) return;
      const open = prior == null ? rows[0].v : prior;
      const close = rows[rows.length - 1].v;
      out.push({ p: p, m: m, rows: rows, open: open, close: close,
        use: r2(Math.max(close - open, 0)), n: rows.length });
    });
  });
  return out;
}
/** units in a stable order: electricity first, then water, then anything else */
function unitOrder(series) {
  const seen = [];
  series.forEach((s) => { if (!seen.some((u) => u.unit === s.m.unit)) seen.push({ unit: s.m.unit, type: s.m.type }); });
  const rank = (t) => (t === "electric" ? 0 : t === "water" ? 1 : 2);
  return seen.sort((a, b) => rank(a.type) - rank(b.type) || a.unit.localeCompare(b.unit));
}
/** what the whole school used on one day, per unit — the paper sum, done for them */
function dayTotals(ds, series) {
  const dd = ds.slice(8, 10);
  const byUnit = {}, byPoint = {};
  series.forEach((s) => {
    const row = s.rows.find((r) => r.day === dd);
    if (!row || row.use == null) return;
    byUnit[s.m.unit] = r2((byUnit[s.m.unit] || 0) + row.use);
    (byPoint[s.p.id] = byPoint[s.p.id] || {})[s.m.id] = row.use;
  });
  return { byUnit, byPoint };
}
const daysInMonth = (ms) => { const [y, m] = ms.split("-").map(Number); return new Date(y, m, 0).getDate(); };

/**
 * The paper log, as a matrix: one row per day of the month, one column per
 * meter of `unit`. `mode` is "use" (units consumed that day) or "read" (the
 * number written on the meter face).
 */
function buildGrid(month, unit, series, mode) {
  const cols = series.filter((s) => s.m.unit === unit);
  const last = month === thisMonth() ? Number(today().slice(8, 10)) : daysInMonth(month);
  // Start at the first day anyone recorded rather than the 1st: a month whose
  // readings begin late would otherwise open on a wall of empty rows, burying
  // today's numbers below a long scroll. Gaps *between* recorded days stay
  // visible, which is the part worth noticing.
  let first = last + 1;
  cols.forEach((s) => s.rows.forEach((r) => {
    const d = Number(r.day);
    if (d < first) first = d;
  }));
  const rows = [];
  for (let d = first; d <= last; d++) {
    const dd = pad2(d);
    const cells = cols.map((s) => {
      const r = s.rows.find((x) => x.day === dd);
      if (!r) return null;
      return mode === "read" ? r.v : r.use;
    });
    rows.push({
      day: dd, cells: cells,
      total: mode === "use" ? r2(cells.reduce((a, c) => a + (c || 0), 0)) : null,
      any: cells.some((c) => c != null),
    });
  }
  const totals = cols.map((_, i) => r2(rows.reduce((a, r) => a + (r.cells[i] || 0), 0)));
  return { cols, rows, totals, grand: r2(totals.reduce((a, b) => a + b, 0)) };
}

/** one row per calendar day that has any reading */
function dailyTable(month, series) {
  const units = unitOrder(series);
  const days = new Set();
  series.forEach((s) => s.rows.forEach((r) => { if (r.use != null) days.add(r.day); }));
  const rows = [...days].sort().map((d) => {
    const t = dayTotals(month + "-" + d, series).byUnit;
    return { day: d, cells: units.map((u) => t[u.unit] ?? null) };
  });
  const totals = units.map((u, i) => r2(rows.reduce((a, r) => a + (r.cells[i] || 0), 0)));
  return { units, rows, totals };
}

/* ================= shell ================= */
function shell(title, sub, body, tab, opts) {

  const tabs = [["home","หน้าหลัก","home"],["hist","ประวัติ","book"],["grid","ตาราง","table"],
    ["rep","รายงาน","out"],["set","ตั้งค่า","gear"]];
  return '<div class="wrap"><header class="topbar">' +
    (o.back ? '<button class="iconbtn" data-act="back" aria-label="ย้อนกลับ">' + svg("left") + "</button>" : "") +
    "<h1>" + esc(title) + (sub ? '<div class="sub">' + esc(sub) + "</div>" : "") + "</h1>" +
    (S.me ? '<button class="who" data-act="go" data-v="set">' + esc(S.me.name) + "</button>" : "") +
    "</header><main>" + body + "</main>" + (o.dock || "") +

const emptyBox = (ic, msg, extra) => '<div class="empty">' + svg(ic) + "<p>" + msg + "</p>" + (extra||"") + "</div>";
const mIcon = (t) => svg(t === "electric" ? "bolt" : "drop");

/* ================= home ================= */
function vHome() {
  const ds = S.day, dd = ds.slice(8, 10);
  const isToday = ds === today();
  const md = S.months[monthOf(ds)] || {};
  const series = monthSeries(monthOf(ds));
  const { byUnit, byPoint } = dayTotals(ds, series);
  const units = unitOrder(series);
  const pts = S.points.filter((p) => p.active !== false);
  let totM = 0, doneM = 0, doneP = 0;

  const rows = pts.map((p) => {
    const ms = activeMeters(p);
    const vals = ((md[p.id] || {})[dd] || {}).vals || {};
    const used = byPoint[p.id] || {};
    const n = ms.filter((m) => vals[m.id] != null).length;
    totM += ms.length; doneM += n;
    if (ms.length && n === ms.length) doneP++;
    const state = !n ? "todo" : n === ms.length ? "done" : "part";
    return '<button class="prow" data-act="rec" data-p="' + esc(p.id) + '" data-d="' + ds + '">' +
      '<span class="stripe' + (state === "done" ? " done" : "") + '"></span>' +
      '<span class="pmain"><span class="pname">' + esc(p.name) + "</span>" +
        '<span class="mchips">' + ms.map((m) => {
          const on = vals[m.id] != null;
          const u = used[m.id];
          return '<span class="chip ' + (on ? (m.type === "electric" ? "e" : "w") : "off") + '">' +
            mIcon(m.type) + esc(m.label) +
            (on ? (u != null ? " <b>+" + fmt(u) + "</b>" : " <b>" + fmt(vals[m.id]) + "</b>") : "") + "</span>";
        }).join("") + "</span></span>" +
      '<span class="pend"><span class="pill ' + state + '">' +
        (state === "done" ? "ครบ" : state === "part" ? n + "/" + ms.length : "ยังไม่บันทึก") + "</span></span>" +
      "</button>";
  }).join("");

  const pct = totM ? Math.round((doneM / totM) * 100) : 0;
  const suffix = isToday ? "วันนี้" : "วันนั้น";
  const totalCards = units.length
    ? '<div class="totals">' + units.map((u) =>
        '<div class="totbox ' + (u.type === "electric" ? "e" : "w") + '">' +
        '<div class="tl">' + mIcon(u.type) + (u.type === "electric" ? "ไฟฟ้า" : "น้ำ") + suffix + "</div>" +
        '<div class="tv">' + fmt(byUnit[u.unit] ?? 0) + "</div>" +
        '<div class="tu">' + esc(u.unit) + "</div></div>").join("") + "</div>"
    : "";

  const body = '<div class="card daycard">' +
    '<div class="dayhead">' +
      '<button class="iconbtn" data-act="day" data-k="-1" aria-label="วันก่อนหน้า">' + svg("left") + "</button>" +
      '<div><div class="d1">' + (isToday ? "รอบบันทึกประจำวัน" : "ดูย้อนหลัง") + "</div>" +
      '<div class="d2">' + thDate(ds) + "</div></div>" +
      '<button class="iconbtn" data-act="day" data-k="1"' + (isToday ? " disabled" : "") +
        ' aria-label="วันถัดไป">' + svg("right") + "</button>" +
    "</div>" +
    '<div class="meter"><i style="width:' + pct + '%"></i></div>' +
    '<div class="meterlabel"><span>ครบแล้ว <b>' + doneP + "</b> จาก <b>" + pts.length + "</b> จุด · มิเตอร์ <b>" + doneM + "</b>/<b>" + totM + "</b></span><span><b>" + pct + "</b>%</span></div>" +
    totalCards +
    (units.length ? '<p class="note" style="margin:9px 0 0;font-size:11px">ยอดใช้' + suffix +
      " = เลข" + suffix + " ลบ เลขครั้งก่อน รวมทุกจุด</p>" : "") +
    (isToday ? "" : '<button class="btn sm block" data-act="gotoday" style="margin-top:11px">' +
      "กลับมาวันนี้</button>") +
    "</div>" +
    (pts.length ? '<div class="stack" style="margin-top:14px">' + rows + "</div>"
      : emptyBox("gauge", "ยังไม่มีจุดมิเตอร์",
        '<button class="btn sm" data-act="seed" style="flex:none;padding:10px 18px">ติดตั้ง 10 จุดของ BISB</button>'));
  return shell("บันทึกมิเตอร์", ORG, body, "home");
}

/* ================= record ================= */
const R = { pid: null, date: null, vals: {}, prevs: {}, note: "", shots: [], exist: null, busy: false };

async function openRecord(pid, dateStr) {
  const ds = dateStr || S.day || today();
  const p = S.points.find((x) => x.id === pid);
  R.pid = pid; R.date = ds; R.vals = {}; R.prevs = {}; R.note = ""; R.shots = []; R.busy = false; R.exist = null;
  S.view = "rec"; render();

  const days = (await loadMonth(monthOf(ds)))[pid] || {};
  const e = days[ds.slice(8, 10)];
  if (e) {
    R.exist = e;
    R.note = e.note || "";
    Object.keys(e.vals || {}).forEach((k) => { R.vals[k] = String(e.vals[k]); });
    R.shots = (e.photos || []).map((id) => ({ id: id, url: null, loading: true }));
  }
  for (const m of activeMeters(p || {})) R.prevs[m.id] = await prevFor(pid, m.id, ds);
  if (S.view === "rec") render();

  for (const s of R.shots) {
    try { const d = await S.db.doc("photos/" + s.id).get(); s.url = d.exists ? (d.data() || {}).img : null; }
    catch (err) { s.url = null; }
    s.loading = false;
    if (S.view === "rec") render();
  }
}

function meterCard(m) {
  const raw = R.vals[m.id] == null ? "" : R.vals[m.id];
  const cur = raw === "" ? null : Number(raw);
  const ok = cur != null && !Number.isNaN(cur);
  const pv = R.prevs[m.id] ? R.prevs[m.id].v : null;
  const use = ok && pv != null ? r2(cur - pv) : null;
  const back = ok && pv != null && cur < pv;
  return '<div class="mcard"><header>' +
      '<span class="dot ' + (m.type === "electric" ? "e" : "w") + '">' + mIcon(m.type) + "</span>" +
      '<span class="nm">' + esc(m.label) + '</span><span class="un">' + esc(m.unit) + "</span>" +
    "</header>" +
    '<div class="reg"><input type="text" inputmode="decimal" autocomplete="off" placeholder="0" ' +
      'data-m="' + esc(m.id) + '" aria-label="เลขมิเตอร์ ' + esc(m.label) + '" value="' + esc(raw) + '"></div>' +
    '<div class="mfoot"><span>ครั้งก่อน <b>' + (pv == null ? "—" : fmt(pv)) + "</b>" +
      (R.prevs[m.id] ? " <span style=\"opacity:.75\">(" + thDate(R.prevs[m.id].date) + ")</span>" : "") + "</span>" +
      '<span class="u">ใช้ไป <b id="u_' + esc(m.id) + '">' + (use == null || use < 0 ? "—" : fmt(use)) + "</b> " + esc(m.unit) + "</span></div>" +
    '<div class="mwarn" id="w_' + esc(m.id) + '"' + (back ? "" : " hidden") + ">เลขน้อยกว่าครั้งก่อน — ตรวจสอบอีกครั้ง หรือใส่หมายเหตุถ้าเปลี่ยนมิเตอร์ใหม่</div>" +
    "</div>";
}

function vRecord() {
  const p = S.points.find((x) => x.id === R.pid);
  if (!p) return shell("ไม่พบจุด", "", emptyBox("gauge", "จุดนี้ถูกลบไปแล้ว"), null, { back: true });
  const ms = activeMeters(p);

  const body = '<div class="stack" style="gap:13px">' +
    (R.exist ? '<div class="banner ok">บันทึกไว้แล้วโดย ' + esc(R.exist.by || "—") +
      " — แก้ไขแล้วกดบันทึกซ้ำเพื่อทับของเดิม</div>" : "") +
    (R.date === today() ? "" : '<div class="banner info">กำลังแก้ข้อมูลย้อนหลังของวันที่ ' +
      thDate(R.date) + "</div>") +
    '<div><div class="eyebrow" style="margin-bottom:9px">รูปถ่ายของจุดนี้</div><div class="shots">' +
      R.shots.map((s, i) => '<div class="shot">' +
        (s.loading ? '<div style="display:grid;place-items:center;height:100%;color:var(--ink-3)"><span class="spin"></span></div>'
          : s.url ? '<img src="' + s.url + '" alt="รูปมิเตอร์ ' + (i+1) + '">'
          : '<div style="display:grid;place-items:center;height:100%;color:var(--ink-3);font-size:11px">โหลดไม่ได้</div>') +
        '<button data-act="rmshot" data-i="' + i + '" aria-label="ลบรูป">' + svg("x") + "</button></div>").join("") +
      '<button class="addshot" data-act="shot">' + svg("cam") + "<span>ถ่ายรูป</span></button></div></div>" +
    '<div class="eyebrow">เลขมิเตอร์ (' + ms.length + " ตัว)</div>" +
    '<div class="stack" style="gap:10px">' + ms.map(meterCard).join("") + "</div>" +
    '<div><label class="flabel" for="nt">หมายเหตุ (ถ้ามี)</label>' +
    '<textarea class="txt" id="nt" rows="2" placeholder="เช่น เปลี่ยนมิเตอร์ใหม่, มิเตอร์ชำรุด">' + esc(R.note) + "</textarea></div>" +
    (R.exist ? '<button class="btn ghost block sm" data-act="delentry" style="color:var(--warn)">' +
      "ลบรายการของวันนี้ทิ้ง</button>" : "") + "</div>";

  const dock = '<div class="dock"><div class="dock-inner">' +
    '<button class="btn ghost" data-act="back">ยกเลิก</button>' +
    '<button class="btn" data-act="save"' + (R.busy ? " disabled" : "") + ">" +
      (R.busy ? '<span class="spin"></span> กำลังบันทึก…' : "บันทึกข้อมูล") + "</button></div></div>";

  return shell(p.name, thDate(R.date), body, null, { back: true, dock: dock });
}

async function doSave() {
  const p = S.points.find((x) => x.id === R.pid);
  if (!p) return;
  if (!S.me) return toast("ยังไม่ได้เลือกชื่อผู้บันทึก", true);

  const vals = {};
  for (const m of activeMeters(p)) {
    const raw = R.vals[m.id];
    if (raw == null || raw === "") continue;
    const n = Number(raw);
    if (Number.isNaN(n)) return toast("เลขมิเตอร์ " + m.label + " ไม่ถูกต้อง", true);
    vals[m.id] = n;
  }
  if (!Object.keys(vals).length) return toast("กรอกเลขมิเตอร์อย่างน้อย 1 ตัว", true);
  if (!R.shots.length) return toast("ถ่ายรูปมิเตอร์อย่างน้อย 1 รูป", true);

  R.busy = true; render();
  const ds = R.date;
  try {
    const keep = [];
    for (const s of R.shots) {
      if (s.id) { keep.push(s.id); continue; }
      const id = rid("ph");
      await S.db.doc("photos/" + id).set({ img: s.url, pointId: R.pid, date: ds, ts: Date.now() });
      s.id = id; keep.push(id);
    }
    const gone = ((R.exist && R.exist.photos) || []).filter((id) => keep.indexOf(id) < 0);
    await writeEntry(R.pid, ds, {
      vals: vals, by: S.me.name, byId: S.me.id,
      note: (R.note || "").slice(0, 300), photos: keep, ts: Date.now(),
    });
    for (const id of gone) { try { await S.db.doc("photos/" + id).delete(); } catch (e) {} }
    toast("บันทึก " + p.name + " เรียบร้อย");
    S.view = "home"; render();
  } catch (e) {
    R.busy = false; render();
    toast(dbErr(e, "บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง"), true);
  }
}

/* ================= history ================= */
const monthBar = () => '<div class="card" style="padding:7px 9px;margin-bottom:13px"><div class="monthnav">' +
  '<button class="iconbtn" data-act="mv" data-k="-1" aria-label="เดือนก่อน">' + svg("left") + "</button>" +
  '<span class="lbl">' + thMonth(S.month) + "</span>" +
  '<button class="iconbtn" data-act="mv" data-k="1" aria-label="เดือนถัดไป">' + svg("right") + "</button></div></div>";

function vHist() {
  const series = monthSeries(S.month);
  const byPoint = new Map();
  series.forEach((s) => {
    if (!byPoint.has(s.p.id)) byPoint.set(s.p.id, { p: s.p, ms: [] });
    byPoint.get(s.p.id).ms.push(s);
  });
  const cards = [...byPoint.values()].map(({ p, ms }) =>
    '<div class="card led"><div class="ledhead"><span class="pmain"><span class="pname">' + esc(p.name) + "</span></span></div>" +
    ms.map((s) => {
      const tot = r2(s.rows.reduce((a, r) => a + (r.use || 0), 0));
      return '<div class="ledsub"><span class="dot ' + (s.m.type==="electric"?"e":"w") + '">' + mIcon(s.m.type) + "</span>" +
        '<span class="nm">' + esc(s.m.label) + '</span><span class="tt">' + fmt(tot) + " " + esc(s.m.unit) + "</span></div>" +
        s.rows.map((r) => '<div class="ledrow" data-act="rec" data-p="' + esc(p.id) +
          '" data-d="' + S.month + "-" + r.day + '" role="button" tabindex="0">' +
          '<span class="dt">' + thDate(S.month + "-" + r.day) + "</span>" +
          (r.photos[0] ? '<button class="thumb" data-act="pic" data-id="' + esc(r.photos[0]) +
            '" aria-label="ดูรูปมิเตอร์">' + svg("cam") +
            (r.photos.length > 1 ? '<span class="n">' + r.photos.length + "</span>" : "") + "</button>" : "") +
          '<span class="by">' + esc(r.by||"") + (r.note ? " · " + esc(r.note) : "") + "</span>" +
          '<span class="vv"><b>' + fmt(r.v) + "</b>" + (r.use == null ? "" : "<i>+" + fmt(r.use) + "</i>") + "</span>" +
          '<span class="go">' + svg("right") + "</span></div>").join("");
    }).join("") + "</div>").join("");

  return shell("ประวัติการบันทึก", "", monthBar() + (cards || emptyBox("book", "ยังไม่มีข้อมูลในเดือนนี้")), "hist");
}

/* ================= month grid ================= */
const GRID = { mode: "use" };

function gridTable(g, unit, mode) {
  return '<div class="card gwrap"><table class="gt"><thead><tr>' +
    '<th class="c0">วันที่</th>' +
    g.cols.map((s) => '<th><span class="pt">' + esc(s.p.name) + "</span>" + esc(s.m.label) + "</th>").join("") +
    (mode === "use" ? '<th class="sum">รวม</th>' : "") +
    "</tr></thead><tbody>" +
    g.rows.map((r) => '<tr' + (r.any ? "" : ' class="blank"') + '>' +
      '<td class="c0"><button class="daylink" data-act="openday" data-d="' + S.month + "-" + r.day + '">' +
        thDate(S.month + "-" + r.day) + "</button></td>" +
      r.cells.map((c) => '<td class="n' + (c == null ? " z" : "") + '">' +
        (c == null ? "—" : fmt(c)) + "</td>").join("") +
      (mode === "use" ? '<td class="n sum">' + (r.any ? fmt(r.total) : "—") + "</td>" : "") +
      "</tr>").join("") +
    "</tbody>" +
    (mode === "use" ? "<tfoot><tr><td class=\"c0\">รวมทั้งเดือน</td>" +
      g.totals.map((t) => '<td class="n">' + fmt(t) + "</td>").join("") +
      '<td class="n">' + fmt(g.grand) + "</td></tr></tfoot>" : "") +
    "</table></div>";
}

function vGrid() {
  const series = monthSeries(S.month);
  const units = unitOrder(series);
  const mode = GRID.mode;

  const body = monthBar() +
    '<div class="seg" style="margin-bottom:13px">' +
      '<button data-act="gmode" data-m="use" aria-pressed="' + (mode === "use") + '">หน่วยที่ใช้</button>' +
      '<button data-act="gmode" data-m="read" aria-pressed="' + (mode === "read") + '">เลขมิเตอร์</button>' +
    "</div>" +
    (series.length ? units.map((u) => {
      const g = buildGrid(S.month, u.unit, series, mode);
      if (!g.cols.length) return "";
      return '<div class="eyebrow" style="margin-bottom:8px">' +
          (u.type === "electric" ? "ไฟฟ้า" : "น้ำ") + " · " + esc(u.unit) + "</div>" +
        gridTable(g, u.unit, mode) +
        '<div style="height:14px"></div>';
    }).join("") +
    '<p class="note">เลื่อนตารางไปทางซ้าย-ขวาเพื่อดูจุดอื่น · ' +
      (mode === "use" ? "ตัวเลขคือหน่วยที่ใช้ในวันนั้น (เลขวันนั้น ลบ เลขครั้งก่อน)"

  return shell("ตารางรายเดือน", thMonth(S.month), body, "grid");

const csvCell = (v) => { const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
const toCsv = (rows) => "﻿" + rows.map((r) => r.map(csvCell).join(",")).join("\r\n");

/* Filenames stay ASCII on purpose: Chromium (and the in-app browsers on
   phones) drop an all-Thai `download` name and save the file as "download"
   with no .csv extension, which accounting then cannot open. The Thai
   wording lives in the column headers instead. */
function download(name, text) {
  const blob = new Blob([text], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function doCsv(kind) {
  const series = monthSeries(S.month);
  if (!series.length) return toast("ยังไม่มีข้อมูลในเดือนนี้", true);
  let rows, name;
  if (kind === "sum") {
    rows = [["จุด", "มิเตอร์", "ประเภท", "เลขต้นเดือน", "เลขปลายเดือน", "หน่วยที่ใช้", "หน่วยนับ", "จำนวนวันที่บันทึก"]];
    series.forEach((s) => rows.push([s.p.name, s.m.label, s.m.type === "electric" ? "ไฟฟ้า" : "น้ำ",
      s.open, s.close, s.use, s.m.unit, s.n]));
    const byUnit = {};
    series.forEach((s) => { byUnit[s.m.unit] = r2((byUnit[s.m.unit] || 0) + s.use); });
    rows.push([]);
    Object.keys(byUnit).forEach((u) => rows.push(["รวมทั้งหมด", "", "", "", "", byUnit[u], u, ""]));
    name = "BISB-summary-" + S.month + ".csv";
  } else if (kind === "day") {
    const d = dailyTable(S.month, series);
    rows = [["วันที่"].concat(d.units.map((u) => "ใช้ไป (" + u.unit + ")"))];
    d.rows.forEach((r) => rows.push([thDate(S.month + "-" + r.day)].concat(r.cells.map((c) => c == null ? "" : c))));
    rows.push(["รวมทั้งเดือน"].concat(d.totals));
    name = "BISB-daily-usage-" + S.month + ".csv";
  } else if (kind === "grid") {
    // the matrix accounting reads: a block per utility, days down, meters across
    rows = [];
    unitOrder(series).forEach((u) => {
      const g = buildGrid(S.month, u.unit, series, "use");
      if (!g.cols.length) return;
      if (rows.length) rows.push([]);
      rows.push([(u.type === "electric" ? "ไฟฟ้า" : "น้ำ") + " (" + u.unit + ")"]);
      rows.push(["วันที่"].concat(g.cols.map((c) => c.p.name + " - " + c.m.label)).concat(["รวม"]));
      g.rows.forEach((r) => rows.push([thDate(S.month + "-" + r.day)]
        .concat(r.cells.map((c) => c == null ? "" : c))
        .concat([r.any ? r.total : ""])));
      rows.push(["รวมทั้งเดือน"].concat(g.totals).concat([g.grand]));
    });
    name = "BISB-month-grid-" + S.month + ".csv";
  } else {
    rows = [["วันที่", "จุด", "มิเตอร์", "ประเภท", "เลขมิเตอร์", "หน่วยที่ใช้", "หน่วยนับ", "ผู้บันทึก", "หมายเหตุ"]];
    series.forEach((s) => s.rows.forEach((d) => rows.push([
      thDate(S.month + "-" + d.day), s.p.name, s.m.label, s.m.type === "electric" ? "ไฟฟ้า" : "น้ำ",
      d.v, d.use == null ? "" : d.use, s.m.unit, d.by || "", d.note || "" ])));
    name = "BISB-meter-detail-" + S.month + ".csv";
  }
  download(name, toCsv(rows));
  toast("ดาวน์โหลดแล้ว");
}

/** pull a Firebase web config out of whatever the user pasted */
function parseCfg(text) {
  const t = String(text || "");
  const grab = (k) => {
    const m = t.match(new RegExp('["\']?' + k + '["\']?\\s*[:=]\\s*["\']([^"\']+)["\']'));
    return m ? m[1] : "";
  };
  const cfg = {
    apiKey: grab("apiKey"), authDomain: grab("authDomain"), projectId: grab("projectId"),
    storageBucket: grab("storageBucket"), messagingSenderId: grab("messagingSenderId"), appId: grab("appId"),
  };
  if (!cfg.apiKey || !cfg.projectId) return null;
  Object.keys(cfg).forEach((k) => { if (!cfg[k]) delete cfg[k]; });
  return cfg;
}
const b64e = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d = (s) => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))));
function teamLink() {
  let cfg = null;
  try { cfg = JSON.parse(localStorage.getItem(LS_CFG) || "null"); } catch (e) {}
  if (!cfg) return location.href;
  // A query param (?cfg=...), not a #fragment: some chat apps' "open in
  // browser" hand-off drops everything after a '#' before the page ever
  // loads, silently losing the database connection. Query strings don't
  // have that failure mode and GitHub Pages ignores them either way.
  return location.origin + location.pathname + "?cfg=" + b64e(cfg);
}

/* ================= lightbox ================= */
let LB = null;
async function showPic(id) {
  LB = { url: undefined }; renderLb();
  try { const d = await S.db.doc("photos/" + id).get(); LB.url = d.exists ? (d.data() || {}).img : null; }
  catch (e) { LB.url = null; }
  renderLb();
}
function renderLb() {
  const old = $(".lb"); if (old) old.remove();
  if (!LB) return;
  const el = document.createElement("div");
  el.className = "lb";
  el.innerHTML = '<div class="lbbar"><span>รูปมิเตอร์</span><button data-act="closepic">ปิด</button></div>' +
    (LB.url ? '<img src="' + LB.url + '" alt="รูปมิเตอร์">'
      : '<div style="flex:1;display:grid;place-items:center;color:#a3aebd;font-size:13px">' +
        (LB.url === undefined ? "กำลังโหลด…" : "โหลดรูปไม่ได้") + "</div>");
  document.body.appendChild(el);
}

/* ================= render ================= */
function render() {
  if (S.needCfg) { app.innerHTML = vConnect(S.cfgErr); return; }
  if (S.fatal) {
    app.innerHTML = '<div class="gate"><div class="mark">' + svg("gauge") + '</div><h2>เปิดแอปไม่ได้</h2><p class="sub">' + esc(S.fatal) + "</p></div>";
    return;
  }
  if (!S.ready) {
    app.innerHTML = '<div class="gate"><div class="mark">' + svg("gauge") + '</div><p class="sub"><span class="spin"></span> กำลังเชื่อมต่อฐานข้อมูล…</p></div>';
    return;
  }
  if (!S.me) { app.innerHTML = vGate(); return; }
  app.innerHTML = S.view === "rec" ? vRecord() : S.view === "hist" ? vHist()
    : S.view === "grid" ? vGrid() : S.view === "rep" ? vRep()
    : S.view === "set" ? vSet() : vHome();

  document.querySelectorAll(".reg input[data-m]").forEach((el) => {
    el.addEventListener("input", (ev) => {
      const t = ev.target;
      const clean = t.value.replace(/[^0-9.]/g, "").replace(/(\..*)\./g, "$1");
      if (clean !== t.value) t.value = clean;
      const mid = t.dataset.m;
      R.vals[mid] = clean;
      const cur = clean === "" ? null : Number(clean);
      const ok = cur != null && !Number.isNaN(cur);
      const pv = R.prevs[mid] ? R.prevs[mid].v : null;
      const use = ok && pv != null ? r2(cur - pv) : null;
      const ub = document.getElementById("u_" + mid);
      if (ub) ub.textContent = use == null || use < 0 ? "—" : fmt(use);
      const wb = document.getElementById("w_" + mid);
      if (wb) wb.hidden = !(ok && pv != null && cur < pv);
    });
  });
  const nt = $("#nt");
  if (nt) nt.addEventListener("input", (e) => { R.note = e.target.value; });

  // the newest day sits at the bottom of the grid; open there
  if (S.view === "grid") {
    document.querySelectorAll(".gwrap").forEach((w) => { w.scrollTop = w.scrollHeight; });
  }
}

/* ================= actions ================= */
document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act;

  if (a === "connect") {
    const cfg = parseCfg($("#cfg").value);
    if (!cfg) { S.cfgErr = "อ่านค่าไม่ได้ — ต้องมีอย่างน้อย apiKey และ projectId"; return render(); }
    localStorage.setItem(LS_CFG, JSON.stringify(cfg));
    location.hash = ""; location.reload();
    return;
  }
  if (a === "copylink") {
    const link = teamLink();
    try { await navigator.clipboard.writeText(link); toast("คัดลอกลิงก์แล้ว"); }
    catch (e) {
      const r = document.createRange(); r.selectNodeContents($("#tl"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      toast("กดค้างที่ลิงก์เพื่อคัดลอก");
    }
    return;
  }

  if (a === "go") {
    const v = el.dataset.v;
    if (v === "hist" || v === "rep" || v === "grid") { S.month = thisMonth(); await refreshMonth(S.month); }
    if (v === "home" && monthOf(S.day) !== monthOf(today())) await refreshMonth(thisMonth());
    if (v === "home") S.day = today();
    if (v === "set") { SET.tab = "points"; SET.open = null; }
    S.view = v; render(); return;
  }
  if (a === "back") { S.view = "home"; render(); return; }
  if (a === "rec") {
    // the photo thumbnail sits inside a history row; let it win
    if (ev.target.closest('[data-act="pic"]')) return;
    const d = el.dataset.d;
    if (d && monthOf(d) !== monthOf(S.day)) await refreshMonth(monthOf(d));
    if (d) S.day = d;
    await openRecord(el.dataset.p, d);
    return;
  }
  if (a === "day") {
    const [y, m, dd] = S.day.split("-").map(Number);
    const next = dstr(new Date(y, m - 1, dd + Number(el.dataset.k)));
    if (next > today()) return;                    // nothing to read in the future
    if (monthOf(next) !== monthOf(S.day)) await refreshMonth(monthOf(next));
    S.day = next; render(); return;
  }
  if (a === "gotoday") {
    if (monthOf(today()) !== monthOf(S.day)) await refreshMonth(thisMonth());
    S.day = today(); render(); return;
  }
  if (a === "openday") {
    const d = el.dataset.d;
    if (monthOf(d) !== monthOf(S.day)) await refreshMonth(monthOf(d));
    S.day = d; S.view = "home"; render(); scrollTo(0, 0); return;
  }
  if (a === "delentry") {
    if (!confirm("ลบรายการของวันที่ " + thDate(R.date) + " ทิ้ง? ข้อมูลและรูปของวันนี้จะหายไป")) return;
    try {
      await deleteEntry(R.pid, R.date);
      toast("ลบรายการแล้ว");
      S.view = "home"; render();
    } catch (e) { toast(dbErr(e, "ลบไม่สำเร็จ"), true); }
    return;
  }
  if (a === "save") { await doSave(); return; }
  if (a === "csv") { doCsv(el.dataset.kind); return; }
  if (a === "pic") { await showPic(el.dataset.id); return; }
  if (a === "closepic") { LB = null; renderLb(); return; }
  if (a === "paper") { buildPaper(); document.body.classList.add("printing"); scrollTo(0, 0); return; }
  if (a === "closepaper") { document.body.classList.remove("printing"); paperwrap.innerHTML = ""; return; }
  if (a === "doprint") { print(); return; }
  if (a === "mv") { S.month = shiftMonth(S.month, Number(el.dataset.k)); await refreshMonth(S.month); render(); return; }
  if (a === "stab") { SET.tab = el.dataset.t; render(); if (SET.tab === "data") countPhotos(); return; }
  if (a === "gmode") { GRID.mode = el.dataset.m; render(); return; }
  if (a === "shot") { pickPhoto(); return; }
  if (a === "rmshot") { R.shots.splice(Number(el.dataset.i), 1); render(); return; }

  if (a === "seed") {
    el.disabled = true; el.textContent = "กำลังติดตั้ง…";
    try { await S.db.doc(P_POINTS).set({ items: seedPoints() }); toast("ติดตั้ง 10 จุดเรียบร้อย"); }
    catch (e) { toast(dbErr(e), true); render(); }
    return;
  }

  if (a === "who") { G.who = S.staff.find((t) => t.id === el.dataset.id) || null; G.pin = ""; G.err = ""; render(); return; }
  if (a === "unwho") { G.who = null; G.pin = ""; G.err = ""; render(); return; }
  if (a === "del") { G.pin = G.pin.slice(0, -1); render(); return; }
  if (a === "dig") {
    G.pin = (G.pin + el.dataset.d).slice(0, 4);
    if (G.pin.length === 4) {
      if (await sha(G.pin) === G.who.pin) {
        saveMe({ id: G.who.id, name: G.who.name });
        G.pin = ""; G.err = ""; G.who = null; S.view = "home";
        await refreshMonth(thisMonth()); render();
      } else { G.err = "รหัส PIN ไม่ถูกต้อง"; G.pin = ""; render(); }
    } else render();
    return;
  }
  if (a === "first") {
    const n = ($("#g1").value || "").trim();
    const p = ($("#g2").value || "").replace(/\D/g, "");
    if (!n) { G.err = "กรุณาใส่ชื่อ"; return render(); }
    if (p.length !== 4) { G.err = "PIN ต้องเป็นตัวเลข 4 หลัก"; return render(); }
    try {
      const t = { id: rid("t"), name: n, pin: await sha(p), active: true };
      await S.db.doc(P_STAFF).set({ items: [t] });
      saveMe({ id: t.id, name: t.name }); G.err = ""; S.view = "home"; render();
    } catch (e) { G.err = dbErr(e); render(); }
    return;
  }
  if (a === "switch") { saveMe(null); G.who = null; G.pin = ""; render(); return; }

  if (a === "popen") { SET.open = SET.open === el.dataset.id ? null : el.dataset.id; render(); return; }
  if (a === "addp") {
    const name = ($("#pn").value || "").trim();
    if (!name) return toast("กรุณาใส่ชื่อจุด", true);
    const p = { id: rid("p"), name: name, location: "", order: S.points.length, active: true, meters: [] };
    try { await S.db.doc(P_POINTS).set({ items: S.points.concat([p]) }); SET.open = p.id; toast("เพิ่ม " + name + " แล้ว"); }
    catch (e) { toast(dbErr(e), true); }
    return;
  }
  if (a === "togp") {
    const items = S.points.map((p) => p.id === el.dataset.id ? { ...p, active: p.active === false } : p);
    try { await S.db.doc(P_POINTS).set({ items: items }); } catch (e) { toast(dbErr(e), true); }
    return;
  }
  if (a === "addm") {
    const pid = el.dataset.id;
    const label = ($("#ml_" + pid).value || "").trim();
    const type = $("#mt_" + pid).value;
    const unit = ($("#mu_" + pid).value || "").trim() || (type === "electric" ? "kWh" : M3);
    if (!label) return toast("กรุณาใส่ชื่อมิเตอร์", true);
    const items = S.points.map((p) => p.id === pid
      ? { ...p, meters: (p.meters || []).concat([{ id: rid("m"), type: type, label: label, unit: unit }]) } : p);
    try { await S.db.doc(P_POINTS).set({ items: items }); toast("เพิ่มมิเตอร์แล้ว"); }
    catch (e) { toast(dbErr(e), true); }
    return;
  }
  if (a === "delm") {
    const pid = el.dataset.p, mid = el.dataset.m;
    if (!confirm("ลบมิเตอร์นี้ออกจากจุด? ข้อมูลที่บันทึกไว้แล้วยังอยู่ในประวัติ")) return;
    const items = S.points.map((p) => p.id === pid
      ? { ...p, meters: (p.meters || []).filter((m) => m.id !== mid) } : p);
    try { await S.db.doc(P_POINTS).set({ items: items }); } catch (e) { toast(dbErr(e), true); }
    return;
  }
  if (a === "adds") {
    const n = ($("#sn").value || "").trim();
    const p = ($("#sp").value || "").replace(/\D/g, "");
    if (!n) return toast("กรุณาใส่ชื่อช่าง", true);
    if (p.length !== 4) return toast("PIN ต้องเป็นตัวเลข 4 หลัก", true);
    try {
      await S.db.doc(P_STAFF).set({ items: S.staff.concat([{ id: rid("t"), name: n, pin: await sha(p), active: true }]) });
      toast("เพิ่ม " + n + " แล้ว");
    } catch (e) { toast(dbErr(e), true); }
    return;
  }
  if (a === "togs") {
    const items = S.staff.map((t) => t.id === el.dataset.id ? { ...t, active: t.active === false } : t);
    try { await S.db.doc(P_STAFF).set({ items: items }); } catch (e) { toast(dbErr(e), true); }
    return;
  }
  if (a === "pin") {
    const v = prompt("ตั้งรหัส PIN ใหม่ 4 หลัก");
    if (v == null) return;
    const p = v.replace(/\D/g, "");
    if (p.length !== 4) return toast("PIN ต้องเป็นตัวเลข 4 หลัก", true);
    const h = await sha(p);
    const items = S.staff.map((t) => t.id === el.dataset.id ? { ...t, pin: h } : t);
    try { await S.db.doc(P_STAFF).set({ items: items }); toast("ตั้ง PIN ใหม่แล้ว"); }
    catch (e) { toast(dbErr(e), true); }
    return;
  }
  if (a === "prune") { await prune(el); return; }
});

/* photos */
let fileInput = null;
function pickPhoto() {
  if (!fileInput) {
    fileInput = document.createElement("input");
    fileInput.type = "file"; fileInput.accept = "image/*";
    fileInput.capture = "environment"; fileInput.multiple = true;
    fileInput.style.display = "none";
    document.body.appendChild(fileInput);
    fileInput.addEventListener("change", async () => {
      const files = [...fileInput.files];
      fileInput.value = "";
      if (!files.length) return;
      if (R.shots.length + files.length > 8) return toast("ใส่รูปได้สูงสุด 8 รูปต่อจุด", true);
      for (const f of files) {
        const slot = { id: null, url: null, loading: true };
        R.shots.push(slot); render();
        try { slot.url = await shrink(f); }
        catch (e) { R.shots.splice(R.shots.indexOf(slot), 1); toast("อ่านรูปนี้ไม่ได้ ลองถ่ายใหม่", true); }
        slot.loading = false; render();
      }
    });
  }
  fileInput.click();
}
async function countPhotos() {
  try { S.photoCount = (await S.db.collection("photos").limit(1000).get()).size; }
  catch (e) { S.photoCount = null; }
  if (S.view === "set" && SET.tab === "data") render();
}
async function prune(btn) {
  const cut = dstr(new Date(Date.now() - 120 * 86400000));
  btn.disabled = true; btn.textContent = "กำลังลบ…";
  let n = 0;
  try {
    const s = await S.db.collection("photos").where("date", "<", cut).limit(300).get();
    for (const d of s.docs) { await S.db.doc("photos/" + d.id).delete(); n++; }
  } catch (e) { toast(dbErr(e), true); }
  toast(n ? "ลบรูปเก่า " + n + " รูปแล้ว" : "ไม่มีรูปเก่าให้ลบ");
  await countPhotos(); render();
}

/** load a month plus the closing value each meter carried into it */
async function refreshMonth(m) {
  await loadMonth(m, true);
  // Look back up to three months, the same window the record screen uses:
  // a meter skipped for a whole month still gets its opening value, so the
  // first day of the month is never silently left without a usage figure.
  const back = [];
  for (let i = 1; i <= 3; i++) back.push(await loadMonth(shiftMonth(m, -i)));
  const priors = {};
  S.points.forEach((p) => {
    const per = {};
    activeMeters(p).forEach((mt) => {
      for (const pm of back) {
        const days = pm[p.id] || {};
        let found = null;
        for (const k of Object.keys(days).sort().reverse()) {
          const v = (days[k].vals || {})[mt.id];
          if (v != null) { found = v; break; }
        }
        if (found != null) { per[mt.id] = found; break; }
      }
    });
    priors[p.id] = per;
  });
  S.priors[m] = priors;
}

/* ================= boot ================= */
render();

(async function boot() {
  // A team link carries the database config as ?cfg=... (older links some
  // people may still have saved use #cfg=... — both are read here so
  // neither breaks). Save it to this device, then strip it from the
  // address bar so refreshing or re-sharing the plain URL doesn't repost it.
  const carried = new URLSearchParams(location.search).get("cfg")
    || (location.hash.match(/cfg=([A-Za-z0-9\-_]+)/) || [])[1];
  if (carried) {
    try {
      localStorage.setItem(LS_CFG, JSON.stringify(b64d(carried)));
      history.replaceState(null, "", location.pathname);
    } catch (e) {}
  }
  let cfg = null;
  try { cfg = JSON.parse(localStorage.getItem(LS_CFG) || "null"); } catch (e) {}
  if (!cfg || !cfg.apiKey) { S.needCfg = true; return render(); }

  let fs;
  try {
    const fbApp = initializeApp(cfg);
    fs = initializeFirestore(fbApp, {
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }),
    });
  } catch (e) {
    S.needCfg = true; S.cfgErr = "เชื่อมต่อไม่สำเร็จ ตรวจสอบค่าที่วางอีกครั้ง";
    return render();
  }
  S.db = makeDb(fs);
  loadMe();

  let booted = false;
  S.db.doc(P_POINTS).onSnapshot((s) => {
    S.points = (s.exists && Array.isArray((s.data() || {}).items)) ? s.data().items : [];
    if (booted) render();
  }, (e) => toast(dbErr(e), true));

  S.db.doc(P_STAFF).onSnapshot((s) => {
    S.staff = (s.exists && Array.isArray((s.data() || {}).items)) ? s.data().items : [];
    if (S.me && !S.staff.some((t) => t.id === S.me.id && t.active !== false)) saveMe(null);
    if (booted) render();
  }, (e) => toast(dbErr(e), true));

  S.db.collection("readings").where("month", "==", thisMonth()).onSnapshot((s) => {
    const out = {};
    s.docs.forEach((d) => { const v = d.data() || {}; if (v.pointId) out[v.pointId] = v.days || {}; });
    S.months[thisMonth()] = out;
    if (booted && S.view !== "rec") render();
  }, (e) => toast(dbErr(e), true));

  await new Promise((r) => setTimeout(r, 900));
  await refreshMonth(thisMonth());
  booted = true;
  S.ready = true;
  render();
})();
</script>
