# เผยแพร่แอปขึ้น GitHub Pages ให้ได้ลิงก์ถาวรสำหรับติดตั้งลงมือถือ
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/english-learning-app-beginners-ftmofn
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: สร้างไฟล์เว็บจากไฟล์ต้นฉบับ
        run: node scripts/build.mjs

      - name: ตั้งค่า GitHub Pages (เปิดให้อัตโนมัติถ้ายังไม่ได้เปิด)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
