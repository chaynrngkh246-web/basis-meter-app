<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#14181f; --muted:#61708a; --line:#e3e8ef;
    --brand:#2f6df6; --brand-ink:#ffffff; --brand-soft:#e8f0ff;
    --ok:#128a5b; --ok-soft:#e2f6ec; --warn:#b26a00; --warn-soft:#fdf1dd;
    --bad:#c8372d; --bad-soft:#fdeceb; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.07);
    --r:16px;
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1116; --card:#161b23; --ink:#eaeef6; --muted:#9aa8bf; --line:#252c37;
      --brand:#5c8dff; --brand-ink:#0b1220; --brand-soft:#1b2740;
      --ok:#4ad297; --ok-soft:#12301f; --warn:#f0b45c; --warn-soft:#33260f;
      --bad:#ff8377; --bad-soft:#361a19;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1116; --card:#161b23; --ink:#eaeef6; --muted:#9aa8bf; --line:#252c37;
    --brand:#5c8dff; --brand-ink:#0b1220; --brand-soft:#1b2740;
    --ok:#4ad297; --ok-soft:#12301f; --warn:#f0b45c; --warn-soft:#33260f;
    --bad:#ff8377; --bad-soft:#361a19;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans Thai","Sarabun",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-text-size-adjust:100%; line-height:1.6;
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 16px 120px}
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; gap:10px; padding:14px 0 10px; border-bottom:1px solid transparent;
  }
  .topbar.scrolled{border-bottom-color:var(--line)}
  .topbar h1{font-size:18px; margin:0; font-weight:800; letter-spacing:-.2px}
  .topbar .sub{font-size:12px; color:var(--muted); font-weight:500}
  .spacer{flex:1}

  button{font-family:inherit}
  .btn{
    appearance:none; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:12px; padding:12px 16px; font-size:15px; font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px;
    transition:transform .06s ease, background .15s ease;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--brand); color:var(--brand-ink); border-color:transparent}
  .btn.ghost{background:transparent}
  .btn.wide{width:100%}
  .btn.sm{min-height:40px; padding:8px 12px; font-size:14px; border-radius:10px}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .icon-btn{
    width:44px; height:44px; min-height:44px; padding:0; border-radius:12px;
    border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; font-size:18px;
  }

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow)}
  .card + .card{margin-top:12px}
  .muted{color:var(--muted)}
  .tiny{font-size:12px}
  .small{font-size:13px}

  /* home */
  .hero{display:flex; gap:14px; align-items:center}
  .ring{width:74px; height:74px; flex:0 0 auto; position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute; inset:0; display:grid; place-items:center; font-weight:800; font-size:15px}
  .statrow{display:flex; gap:8px; margin-top:12px}
  .stat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center}
  .stat b{display:block; font-size:20px; line-height:1.2}
  .stat span{font-size:11px; color:var(--muted)}

  .sect-title{font-size:13px; font-weight:800; color:var(--muted); margin:22px 4px 8px; letter-spacing:.3px}

  .unit{
    display:flex; align-items:center; gap:12px; width:100%; text-align:right;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    cursor:pointer; margin-bottom:8px; box-shadow:var(--shadow);
  }
  .unit:active{transform:scale(.995)}
  .unit .num{
    width:38px; height:38px; flex:0 0 auto; border-radius:11px; display:grid; place-items:center;
    background:var(--brand-soft); color:var(--brand); font-weight:800; font-size:15px;
  }
  .unit.done .num{background:var(--ok-soft); color:var(--ok)}
  .unit .meta{flex:1; text-align:left; min-width:0}
  .unit .meta b{display:block; font-size:15px; font-weight:700}
  .unit .meta span{font-size:12px; color:var(--muted)}
  .bar{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:6px}
  .bar > i{display:block; height:100%; background:var(--brand); border-radius:99px; transition:width .3s ease}
  .bar.ok > i{background:var(--ok)}

  /* lesson */
  .lesson-top{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .lesson-top .bar{flex:1; margin:0}
  .steplabel{
    display:inline-block; font-size:12px; font-weight:800; color:var(--brand);
    background:var(--brand-soft); padding:4px 10px; border-radius:99px; margin-bottom:10px;
  }
  .word-en{font-size:34px; font-weight:800; letter-spacing:-.5px; line-height:1.2; word-break:break-word}
  .word-ph{font-size:18px; color:var(--brand); font-weight:700; margin-top:6px}
  .word-th{font-size:17px; margin-top:8px}
  .ex{margin-top:14px; padding-top:14px; border-top:1px dashed var(--line)}
  .ex .en{font-size:16px; font-weight:600}
  .ex .th{font-size:14px; color:var(--muted)}
  .row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
  .row > *{flex:1}

  .choice{
    display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:14px; font-size:16px; margin-bottom:8px; cursor:pointer; color:var(--ink); font-weight:600;
  }
  .choice.right{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
  .choice.wrong{background:var(--bad-soft); border-color:var(--bad); color:var(--bad)}

  .mic{
    width:110px; height:110px; border-radius:50%; border:none; margin:8px auto; display:grid; place-items:center;
    background:var(--brand); color:var(--brand-ink); font-size:40px; cursor:pointer; box-shadow:0 10px 30px rgba(47,109,246,.35);
  }
  .mic.listening{animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,109,246,.45)}70%{box-shadow:0 0 0 26px rgba(47,109,246,0)}100%{box-shadow:0 0 0 0 rgba(47,109,246,0)}}

  .feedback{border-radius:12px; padding:12px 14px; margin-top:12px; font-weight:700}
  .feedback.good{background:var(--ok-soft); color:var(--ok)}
  .feedback.mid{background:var(--warn-soft); color:var(--warn)}
  .feedback.bad{background:var(--bad-soft); color:var(--bad)}
  .feedback .heard{font-weight:500; font-size:13px; opacity:.85; margin-top:4px}

  /* chat */
  .chat{display:flex; flex-direction:column; gap:10px; padding:4px 0 8px}
  .msg{max-width:85%; padding:11px 14px; border-radius:16px; font-size:16px; line-height:1.5}
  .msg .th{display:block; font-size:12.5px; opacity:.75; margin-top:3px}
  .msg.bot{align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:5px}
  .msg.me{align-self:flex-end; background:var(--brand); color:var(--brand-ink); border-bottom-right-radius:5px}
  .msg.sys{align-self:center; background:transparent; color:var(--muted); font-size:13px; text-align:center}
  .hintbox{background:var(--brand-soft); color:var(--brand); border-radius:12px; padding:10px 12px; font-size:14px; font-weight:600}

  .dlg-line{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
  .dlg-line:last-child{border-bottom:none}
  .who{width:30px; height:30px; flex:0 0 auto; border-radius:9px; display:grid; place-items:center; font-size:12px; font-weight:800; background:var(--line)}
  .who.you{background:var(--brand-soft); color:var(--brand)}
  .dlg-line .t{flex:1}
  .dlg-line .t .en{font-weight:650}
  .dlg-line .t .th{font-size:13px; color:var(--muted)}

  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--card); border-top:1px solid var(--line);
    display:flex; padding:6px 8px calc(6px + env(safe-area-inset-bottom)); gap:4px;
  }
  .tabbar .in{max-width:560px; margin:0 auto; display:flex; width:100%}
  .tab{
    flex:1; border:none; background:transparent; color:var(--muted); font-size:11px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px; cursor:pointer; border-radius:10px;
  }
  .tab .ic{font-size:19px; line-height:1}
  .tab{font-size:10.5px; padding:8px 2px}
  .tab.active{color:var(--brand); background:var(--brand-soft)}

  .banner{background:var(--warn-soft); color:var(--warn); border-radius:12px; padding:12px 14px; font-size:13.5px; font-weight:600; margin-bottom:12px}
  .hidden{display:none !important}
  .center{text-align:center}
  .pill{display:inline-block; font-size:11px; font-weight:800; padding:3px 9px; border-radius:99px; background:var(--line); color:var(--muted)}
  .pill.ok{background:var(--ok-soft); color:var(--ok)}
  input[type=text]{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:16px; font-family:inherit;
  }
  input[type=range]{width:100%; accent-color:var(--brand)}
  .kv{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:none}
  .confetti{font-size:52px; text-align:center; line-height:1}

  .soundhelp{
    position:fixed; left:10px; right:10px; bottom:calc(74px + env(safe-area-inset-bottom)); z-index:50;
    max-width:540px; margin:0 auto; background:var(--card); border:2px solid var(--warn);
    border-radius:14px; padding:8px 10px; box-shadow:var(--shadow); font-size:13.5px;
    max-height:60vh; overflow:auto;
  }
  .sh-bar{display:flex; align-items:center; gap:6px}
  .sh-bar b{flex:1; font-size:13.5px}
  .sh-bar .btn{min-height:36px; padding:6px 10px; font-size:13px}
  .soundhelp ol{margin:10px 0 8px; padding-inline-start:22px; line-height:1.8}
  .soundhelp li{margin-bottom:2px}
  .install{border:2px dashed var(--brand); background:var(--brand-soft)}
  .tier{display:flex; align-items:flex-start; gap:8px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:16px}
  .tier:last-of-type{border-bottom:none}
  .tier .tag{flex:0 0 auto; font-size:10px; font-weight:800; padding:3px 7px; border-radius:99px; margin-top:3px}
  .t-basic .tag{background:var(--bad-soft); color:var(--bad)}
  .t-better .tag{background:var(--warn-soft); color:var(--warn)}
  .t-native .tag{background:var(--ok-soft); color:var(--ok)}
  .t-basic b{color:var(--muted); text-decoration:line-through}
  .t-native b{color:var(--ok)}
  .upnote{margin-top:10px; font-size:13px; line-height:1.7; background:var(--brand-soft); color:var(--brand);
    padding:9px 11px; border-radius:10px}
  .upnote b{font-weight:800}
  .levelbar{display:flex; gap:6px; margin-bottom:10px}
  .lvbtn{flex:1; border:1px solid var(--line); background:var(--card); color:var(--muted);
    border-radius:12px; padding:9px 4px; cursor:pointer; display:flex; flex-direction:column; gap:2px;
    align-items:center; font-family:inherit}
  .lvbtn .lvn{font-size:13px; font-weight:800}
  .lvbtn .lvp{font-size:10px}
  .lvbtn.on{background:var(--brand); color:var(--brand-ink); border-color:transparent}

  .coach{margin-top:12px; border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--card)}
  .coach-head{font-size:12px; font-weight:800; color:var(--muted); margin-bottom:8px}
  .coach-sent{font-size:21px; font-weight:700; line-height:1.75; word-spacing:2px}
  .coach-sent span{padding:1px 3px; border-radius:5px; transition:background .15s}
  .w-ok{color:var(--ok)}
  .w-bad{color:var(--bad); background:var(--bad-soft); text-decoration:underline wavy var(--bad) 1.5px}
  .w-miss{color:var(--muted); background:var(--line); text-decoration:line-through}
  .w-now{outline:2px solid var(--brand); background:var(--brand-soft) !important; color:var(--brand) !important}
  .coach-key{display:flex; gap:12px; margin-top:10px; font-size:11px; color:var(--muted)}
  .coach-key i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px; vertical-align:middle}
  .k-ok{background:var(--ok)} .k-bad{background:var(--bad)} .k-miss{background:var(--muted)}
  .coach-extra{margin-top:8px; font-size:12.5px; color:var(--warn)}
  .coach-tips{margin:10px 0 0; padding-inline-start:20px; font-size:13.5px; line-height:1.75}
  .coach-tips li{margin-bottom:5px}
  .coach-tips b{color:var(--brand)}
  .install b{color:var(--brand)}
  .steps{margin:8px 0 0; padding-inline-start:22px; line-height:1.85; font-size:14px}
</style>

<div class="wrap">
  <header class="topbar" id="topbar">
    <button class="icon-btn hidden" id="backBtn" aria-label="ย้อนกลับ">←</button>
    <div>
      <h1 id="scrTitle">พูดอังกฤษได้</h1>

    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn" aria-label="สลับธีม">◐</button>

</div>

  <div class="in">
    <button class="tab active" data-tab="home"><span class="ic">🏠</span>บทเรียน</button>
    <button class="tab" data-tab="review"><span class="ic">🔁</span>ทบทวน</button>
    <button class="tab" data-tab="talk"><span class="ic">💬</span>คุยโต้ตอบ</button>
    <button class="tab" data-tab="up"><span class="ic">🎓</span>ยกระดับ</button>
    <button class="tab" data-tab="me"><span class="ic">⚙️</span>ตั้งค่า</button>
  </div>
</nav>

<script>
/* ================= หลักสูตร (Curriculum) =================
   เรียงตามความถี่ในการใช้จริง: ทักทาย -> ตัวเลข -> ครอบครัว -> อาหาร ->
   ซื้อของ -> เดินทาง -> งาน -> สุขภาพ -> คุยเล่น -> โทรศัพท์/ที่ทำงาน
   ทุกคำมี: en (อังกฤษ), th (ไทย), ph (คำอ่านไทย), ex/exth (ประโยคตัวอย่าง)
========================================================== */
const LEVELS = [
 { id:"L1", n:1, name:"เริ่มจากศูนย์",   cefr:"A0",     sub:"พูดประโยคพื้นฐานในชีวิตประจำวันได้",   emoji:"🌱" },
 { id:"L2", n:2, name:"พื้นฐานแน่น",     cefr:"A1–A2",  sub:"เล่าอดีต–อนาคต ตั้งคำถาม เปรียบเทียบได้", emoji:"🌿" },
 { id:"L3", n:3, name:"ใช้งานได้จริง",   cefr:"B1",     sub:"แสดงความเห็น อธิบาย นัดหมาย เล่าเรื่องได้", emoji:"🌳" },
 { id:"L4", n:4, name:"ระดับมืออาชีพ",   cefr:"B2–C1",  sub:"ประชุม นำเสนอ เจรจา สัมภาษณ์งานได้",   emoji:"🏆" }
];

const COURSE = [
{ id:"u1", level:"L1", emoji:"👋", title:"ทักทาย & แนะนำตัว", goal:"ทักทาย บอกชื่อ และถามสารทุกข์สุกดิบได้",
  words:[
   {en:"Hello", th:"สวัสดี", ph:"เฮล-โล", ex:"Hello! Nice to meet you.", exth:"สวัสดี! ยินดีที่ได้รู้จัก"},
   {en:"Hi", th:"หวัดดี (เป็นกันเอง)", ph:"ฮาย", ex:"Hi! How are you?", exth:"หวัดดี สบายดีไหม"},
   {en:"Good morning", th:"อรุณสวัสดิ์", ph:"กุด มอร์-นิ่ง", ex:"Good morning, teacher.", exth:"อรุณสวัสดิ์ครับคุณครู"},
   {en:"My name is Ben", th:"ผมชื่อเบน", ph:"มาย เนม อิส เบ็น", ex:"Hello, my name is Ben.", exth:"สวัสดี ผมชื่อเบน"},

     extra = ต้องมีคำอื่นเพิ่มจากโครงกี่คำ (เช่น ชื่อ อาชีพ)

<script>
/* ================== ตัวช่วยพื้นฐาน ================== */
const $ = (s,r=document)=>r.querySelector(s);
const el = (h)=>{const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstElementChild;};
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd = (a)=>a[Math.floor(Math.random()*a.length)];
const shuffle = (a)=>{const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b;};
const todayKey = ()=>new Date().toISOString().slice(0,10);

/* ================== เก็บความคืบหน้า ================== */
const KEY = "speakenglish.v1";
const DEFAULT_STATE = {
  srs:{}, units:{}, xpByDay:{}, streak:0, lastDay:null, goal:20,
  level:"L1", placed:false, scenes:{}, upSeen:{},
  rate:0.85, theme:null, talkIdx:0, totalSpoken:0
};
let S = load();
function load(){
  try{ const raw = localStorage.getItem(KEY); if(!raw) return structuredClone(DEFAULT_STATE);
       return Object.assign(structuredClone(DEFAULT_STATE), JSON.parse(raw)); }
  catch(e){ return structuredClone(DEFAULT_STATE); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function addXP(n){
  const d = todayKey();
  if(S.lastDay !== d){
    const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.streak = (S.lastDay === y) ? (S.streak||0)+1 : 1;
    S.lastDay = d;
  }
  S.xpByDay[d] = (S.xpByDay[d]||0) + n;
  save();
}
const xpToday = ()=> S.xpByDay[todayKey()] || 0;

/* ================== ระบบทบทวนแบบเว้นระยะ (Leitner) ================== */
const STEPS_DAYS = [0, 1, 2, 4, 8, 16, 32];
const cardKey = (u,i)=> u.id + "|" + i;
function grade(u, i, ok){
  const k = cardKey(u,i);
  const c = S.srs[k] || {box:0, due:0, seen:0};
  c.seen++;
  c.box = ok ? Math.min(STEPS_DAYS.length-1, c.box+1) : 0;
  c.due = Date.now() + STEPS_DAYS[c.box]*864e5;
  S.srs[k] = c; save();
}
function dueCards(){
  const out = [];
  COURSE.forEach(u=>u.words.forEach((w,i)=>{
    const c = S.srs[cardKey(u,i)];
    if(c && c.due <= Date.now()) out.push({u,i,w,box:c.box});
  }));
  return out.sort((a,b)=>a.box-b.box);
}
const learnedCount = ()=> Object.keys(S.srs).length;

/* ================== เสียงพูด (Text to Speech) ================== */
let VOICE = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v=>/^en(-|_)?/i.test(v.lang));
  if(!vs.length) return null;
  const pref = ["Google US English","Samantha","Microsoft Aria","Microsoft Zira","Karen","Daniel"];
  for(const p of pref){ const f = vs.find(v=>v.name.includes(p)); if(f) return f; }
  return vs.find(v=>/en[-_]US/i.test(v.lang)) || vs[0];
}
if("speechSynthesis" in window){
  VOICE = pickVoice();
  speechSynthesis.onvoiceschanged = ()=>{ VOICE = pickVoice(); };
  /* Android/iOS บางรุ่นโหลดรายการเสียงช้า ลองซ้ำอีก 3 ครั้ง */
  [400, 1200, 2500].forEach(ms=>setTimeout(()=>{ if(!VOICE) VOICE = pickVoice(); }, ms));
}

/* มือถือจะไม่ยอมเล่นเสียงจนกว่าผู้ใช้จะแตะหน้าจอครั้งแรก
   จึงต้อง "ปลดล็อกเสียง" ด้วยเสียงเงียบๆ ตอนแตะครั้งแรก */
let audioReady = false, ttsProven = false, warnedNoSound = false;
function unlockAudio(){
  if(audioReady || !("speechSynthesis" in window)) return;
  try{
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0.01; u.lang = "en-US";
    speechSynthesis.speak(u);
    audioReady = true;
  }catch(e){}
}
["pointerdown","touchstart","click","keydown"].forEach(ev=>
  addEventListener(ev, unlockAudio, {capture:true, passive:true}));

function speak(text, slow){
  if(!("speechSynthesis" in window)){ showSoundHelp("เบราว์เซอร์นี้ไม่มีเสียงอ่านในตัว"); return; }
  try{
    if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    /* Chrome บางรุ่นค้างอยู่สถานะ paused — แต่บางเบราว์เซอร์ไม่มี resume() จึงต้องเช็กก่อน */
    if(typeof speechSynthesis.resume === "function") speechSynthesis.resume();
    if(!VOICE) VOICE = pickVoice();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    if(VOICE) u.voice = VOICE;
    u.rate = slow ? 0.55 : (S.rate || 0.85);
    u.pitch = 1; u.volume = 1;
    let started = false;
    u.onstart = ()=>{ started = true; ttsProven = true; audioReady = true; hideSoundHelp(); };
    u.onerror = ()=>{ if(!started) showSoundHelp("เบราว์เซอร์เล่นเสียงไม่สำเร็จ"); };
    speechSynthesis.speak(u);
    audioReady = true;
    setTimeout(()=>{ if(!started && !ttsProven) showSoundHelp("เสียงไม่ออกภายใน 1.5 วินาที"); }, 1500);
  }catch(e){ showSoundHelp("เกิดข้อผิดพลาดตอนสั่งให้อ่านออกเสียง"); }
}

/* ================== ฟังเสียงผู้ใช้ (Speech Recognition) ================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const SR_OK = !!SR;
let recog = null, recogBusy = false;
function listen(onResult, onError, onEnd){
  if(!SR_OK){ onError("unsupported"); return; }
  if(recogBusy){ try{ recog.stop(); }catch(e){} return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  recog = new SR();
  recog.lang = "en-US";
  recog.interimResults = false;
  recog.maxAlternatives = 5;
  recog.continuous = false;
  recogBusy = true;
  let got = false;
  recog.onresult = (e)=>{
    got = true;
    const alts = [];
    for(let i=0;i<e.results[0].length;i++) alts.push(e.results[0][i].transcript);
    onResult(alts);
  };
  recog.onerror = (e)=>{ onError(e.error || "error"); };
  recog.onend = ()=>{ recogBusy = false; if(!got && onEnd) onEnd(); };
  try{ recog.start(); }catch(e){ recogBusy = false; onError("start"); }
}
function stopListen(){ if(recog && recogBusy){ try{ recog.stop(); }catch(e){} } }

/* ================== ให้คะแนนการออกเสียง ================== */
const CONTRACTIONS = {"i'm":"i am","it's":"it is","that's":"that is","what's":"what is","don't":"do not",
 "doesn't":"does not","can't":"can not","cannot":"can not","i'll":"i will","you're":"you are","let's":"let us",
 "i've":"i have","isn't":"is not","he's":"he is","she's":"she is","we're":"we are","they're":"they are",
 "i'd":"i would","won't":"will not","didn't":"did not","aren't":"are not","there's":"there is","o'clock":"oclock"};
const NUMWORD = {"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven",
 "8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve","13":"thirteen","14":"fourteen","15":"fifteen",
 "16":"sixteen","17":"seventeen","18":"eighteen","19":"nineteen","20":"twenty","30":"thirty","40":"forty",
 "50":"fifty","60":"sixty","70":"seventy","80":"eighty","90":"ninety","100":"hundred","500":"five hundred"};
function norm(s){
  s = String(s||"").toLowerCase().replace(/[‘’]/g,"'");
  for(const k in CONTRACTIONS) s = s.split(k).join(CONTRACTIONS[k]);
  s = s.replace(/[^a-z0-9'\s]/g," ").replace(/'/g,"");
  s = s.split(/\s+/).map(w => NUMWORD[w] || w).join(" ");
  return s.replace(/\s+/g," ").trim();
}
function lev(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    prev = cur;
  }
  return prev[n];
}
function sameWord(a,b){
  if(a===b) return true;
  const L = Math.max(a.length,b.length);
  if(L<=3) return false;
  return lev(a,b) <= (L>=7 ? 2 : 1);
}
function scoreSpeech(target, said){
  const t = norm(target).split(" ").filter(Boolean);
  const s = norm(said).split(" ").filter(Boolean);
  if(!t.length) return 0;
  const m=t.length, n=s.length;
  let prev = Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (sameWord(t[i-1],s[j-1])?0:1));
    }
    prev = cur;
  }
  const d = prev[n];
  return Math.max(0, Math.round(100 * (1 - d/Math.max(m,n||1))));
}
/* ================== ตัวโค้ช: บอกว่าผิดตรงคำไหน และต้องแก้ยังไง ==================
   1) จับคู่คำในประโยคที่ถูก กับคำที่ผู้เรียนพูดจริง (word alignment)
   2) ชี้ว่าคำไหนถูก คำไหนขาด คำไหนพูดผิดเป็นคำอื่น
   3) วิเคราะห์เป็นภาษาไทยว่าเป็นข้อผิดพลาดแบบไหน — เน้นจุดที่คนไทยพลาดบ่อย   */

function alignWords(T, S){
  const m = T.length, n = S.length;
  const d = [], bt = [];
  for(let i=0;i<=m;i++){ d.push(new Array(n+1).fill(0)); bt.push(new Array(n+1).fill("")); }
  for(let i=1;i<=m;i++){ d[i][0] = i; bt[i][0] = "miss"; }
  for(let j=1;j<=n;j++){ d[0][j] = j; bt[0][j] = "extra"; }
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    /* ใช้ sameWord เพื่อ "จับคู่" คำที่ใกล้เคียงกันให้ตรงตำแหน่ง
       แต่จะนับว่าพูดถูกก็ต่อเมื่อตรงเป๊ะเท่านั้น — เพราะการลืม s หรือ -ed
       คือสิ่งที่ผู้เรียนต้องรู้ ไม่ใช่สิ่งที่ควรปล่อยผ่าน */
    const near = sameWord(T[i-1], S[j-1]);
    const exact = T[i-1] === S[j-1];
    const sub = d[i-1][j-1] + (near ? 0 : 1);
    const del = d[i-1][j] + 1;
    const ins = d[i][j-1] + 1;
    const b = Math.min(sub, del, ins);
    d[i][j] = b;
    bt[i][j] = (b === sub) ? (exact ? "ok" : "wrong") : (b === del ? "miss" : "extra");
  }
  const ops = [];
  let i = m, j = n;
  while(i > 0 || j > 0){
    const op = (i === 0) ? "extra" : (j === 0) ? "miss" : bt[i][j];
    if(op === "ok" || op === "wrong"){ ops.push({op, t:T[i-1], s:S[j-1]}); i--; j--; }
    else if(op === "miss"){ ops.push({op:"miss", t:T[i-1]}); i--; }
    else { ops.push({op:"extra", s:S[j-1]}); j--; }
  }
  return ops.reverse();
}

const BE_WORDS   = ["am","is","are","was","were","be","been"];
const ARTICLES   = ["a","an","the"];
const AUX_WORDS  = ["do","does","did","will","would","can","could","have","has","should"];
const TH_HARD    = { "th":"เสียง th ต้องแลบลิ้นแตะฟันบนเบาๆ ไม่ใช่เสียง ด / ท / ส",
                     "v":"เสียง V ต้องเอาฟันบนแตะริมฝีปากล่าง ไม่ใช่เสียง ว",
                     "r":"เสียง R ห้ามให้ลิ้นแตะเพดานปาก (ไม่ใช่ ร เรือแบบไทย)",
                     "l":"เสียง L ต้องเอาลิ้นแตะเพดานปากค้างไว้ และออกเสียงท้ายคำให้ครบ" };

function coachTips(target, said, ops){
  const T = norm(target).split(" ").filter(Boolean);
  const S = norm(said).split(" ").filter(Boolean);
  const tips = [];
  const miss  = ops.filter(o => o.op === "miss").map(o => o.t);
  const wrong = ops.filter(o => o.op === "wrong");

  if(!S.length) return ["ยังไม่ได้ยินเสียงเลย ลองพูดดังขึ้นแล้วกดไมค์ใหม่"];

  if(miss.some(w => BE_WORDS.includes(w)))
    tips.push(`ขาด verb to be (<b>${miss.filter(w=>BE_WORDS.includes(w)).join(", ")}</b>) — ภาษาไทยไม่มีคำว่า “เป็น/อยู่/คือ” ในประโยคแบบนี้ แต่ภาษาอังกฤษ<b>ต้องมีเสมอ</b>`);

  if(miss.some(w => ARTICLES.includes(w)))
    tips.push(`ขาดคำนำหน้านาม (<b>${miss.filter(w=>ARTICLES.includes(w)).join(", ")}</b>) — ภาษาอังกฤษต้องมี a / an / the หน้าคำนาม เช่น “a teacher” ไม่ใช่ “teacher” เฉยๆ`);

  if(miss.some(w => AUX_WORDS.includes(w)))
    tips.push(`ขาดกริยาช่วย (<b>${miss.filter(w=>AUX_WORDS.includes(w)).join(", ")}</b>) — คำพวก do / did / will / can ห้ามตัดทิ้ง ไม่งั้นความหมายเพี้ยน`);

  wrong.forEach(o=>{
    if(o.t === o.s + "s")
      tips.push(`ลืมเสียง <b>s</b> ท้ายคำ — พูดว่า “${o.s}” แต่ต้องเป็น “<b>${o.t}</b>” ฝรั่งฟังออกนะครับ`);
    else if(o.t === o.s + "ed" || o.t === o.s + "d")
      tips.push(`ประโยคนี้เป็น<b>อดีต</b> ต้องเติม -ed — “${o.s}” ต้องเป็น “<b>${o.t}</b>”`);
    else if(o.t.replace(/l/g,"r") === o.s.replace(/l/g,"r") && o.t !== o.s)
      tips.push(TH_HARD.r + ` — คุณพูด “${o.s}” แต่คำที่ถูกคือ “<b>${o.t}</b>”`);
  });

  /* เสียงที่คนไทยออกยาก — เตือนเฉพาะคำที่พูดผิดจริง */
  const badWords = wrong.map(o => o.t).concat(miss);
  if(badWords.some(w => w.startsWith("th"))) tips.push(TH_HARD.th);
  if(badWords.some(w => w.includes("v")))    tips.push(TH_HARD.v);
  if(badWords.some(w => /l$/.test(w)))       tips.push(TH_HARD.l);

  if(!tips.length && miss.length)
    tips.push(`ขาดคำว่า <b>${miss.join(", ")}</b> — ลองพูดช้าๆ ให้ครบทุกคำ`);
  if(!tips.length && wrong.length)
    tips.push(`คำที่ยังไม่ตรงคือ <b>${wrong.map(o=>o.t).join(", ")}</b> — กดปุ่มฝึกทีละคำด้านล่างได้ครับ`);
  if(S.length > T.length + 2)
    tips.push("พูดเกินมาหลายคำ ลองพูดเฉพาะประโยคที่ให้ไว้ สั้นๆ ชัดๆ ก็พอ");

  return tips.slice(0, 3);
}

/* แสดงผลเป็น HTML: ประโยคที่ถูก โดยระบายสีทีละคำว่าถูก/ผิด/ขาด */
function coachHtml(target, said){
  const T = norm(target).split(" ").filter(Boolean);
  const S = norm(said || "").split(" ").filter(Boolean);
  const ops = alignWords(T, S);
  const tw = String(target).split(/\s+/);   /* คำจริงพร้อมเครื่องหมาย ไว้แสดงผล */
  let ti = 0;
  const marked = ops.filter(o => o.op !== "extra").map(o=>{
    const disp = tw[ti++] || o.t;
    const cls = o.op === "ok" ? "w-ok" : o.op === "wrong" ? "w-bad" : "w-miss";
    const title = o.op === "wrong" ? ` title="คุณพูดว่า ${esc(o.s)}"` : "";
    return `<span class="${cls}"${title}>${esc(disp)}</span>`;
  }).join(" ");
  const extra = ops.filter(o => o.op === "extra").map(o => o.s);
  const tips = coachTips(target, said, ops);
  const okCount = ops.filter(o => o.op === "ok").length;

  return `
    <div class="coach">
      <div class="coach-head">พูดถูก ${okCount} จาก ${T.length} คำ</div>
      <div class="coach-sent">${marked}</div>
      <div class="coach-key">
        <span><i class="k-ok"></i>ถูก</span>
        <span><i class="k-bad"></i>ผิดคำ</span>
        <span><i class="k-miss"></i>ไม่ได้พูด</span>
      </div>
      ${extra.length ? `<div class="coach-extra">คำที่พูดเกินมา: ${esc(extra.join(", "))}</div>` : ""}
      ${tips.length ? `<ul class="coach-tips">${tips.map(t=>`<li>${t}</li>`).join("")}</ul>` : ""}
    </div>`;
}

/* อ่านประโยคทีละคำ ช้าๆ พร้อมไฮไลต์คำที่กำลังอ่าน */
let wordTimer = null;
function playWordByWord(target, container){
  clearTimeout(wordTimer);
  const words = String(target).split(/\s+/);
  const box = container.querySelector(".coach-sent");
  if(!box) { speak(target, true); return; }
  const spans = box.querySelectorAll("span");
  let i = 0;
  const step = ()=>{
    spans.forEach(sp => sp.classList.remove("w-now"));
    if(i >= words.length){ setTimeout(()=>speak(target, true), 400); return; }
    if(spans[i]) spans[i].classList.add("w-now");
    speak(words[i].replace(/[^A-Za-z']/g, ""));
    i++;
    wordTimer = setTimeout(step, 900);
  };
  step();
}

function bestScore(target, alts){
  let best = 0, bestText = alts[0]||"";
  alts.forEach(a=>{ const sc = scoreSpeech(target,a); if(sc>best){ best=sc; bestText=a; } });
  return {score:best, text:bestText};
}
const micErrText = (e)=>({

<script>
/* ================== การติดตั้งลงมือถือ (PWA) ================== */

function wireShare(){
  const s1 = document.getElementById("doShare");
  if(s1) s1.onclick = async ()=>{
    const data = { title:"พูดอังกฤษได้", text:INVITE, url:APP_URL };
    try{
      if(navigator.share){ await navigator.share(data); return; }
      throw new Error("no share");
    }catch(e){
      if(e && e.name === "AbortError") return;      /* ผู้ใช้กดยกเลิกเอง ไม่ต้องทำอะไร */
      copyTo(INVITE + "\n" + APP_URL, s1, "✅ คัดลอกแล้ว — เอาไปวางในแชทได้เลย");
    }
  };
  const c1 = document.getElementById("copyLink");
  if(c1) c1.onclick = ()=>copyTo(APP_URL, c1, "✅ คัดลอกลิงก์แล้ว");
  const c2 = document.getElementById("copyMsg");
  if(c2) c2.onclick = ()=>copyTo(INVITE + "\n" + APP_URL, c2, "✅ คัดลอกข้อความแล้ว");
}

async function copyTo(text, btn, okMsg){
  const old = btn.textContent;
  try{
    await navigator.clipboard.writeText(text);
    btn.textContent = okMsg;
  }catch(e){
    /* เบราว์เซอร์เก่าบางตัวคัดลอกอัตโนมัติไม่ได้ ให้เลือกข้อความให้ผู้ใช้กดคัดลอกเอง */
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let done = false;
    try{ done = document.execCommand("copy"); }catch(e2){}
    ta.remove();
    btn.textContent = done ? okMsg : "คัดลอกไม่ได้ — กดค้างที่ลิงก์ด้านล่างแทน";
  }
  setTimeout(()=>{ btn.textContent = old; }, 2500);
}

function wireInstall(){
  const c = document.getElementById("copyUrl");
  if(c) c.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(APP_URL); c.textContent = "✅ คัดลอกแล้ว"; }
    catch(e){ c.textContent = "คัดลอกไม่ได้ — กดค้างที่ลิงก์ด้านล่างเพื่อคัดลอก"; }
  };
  const b = document.getElementById("doInstall");
  if(b) b.onclick = async ()=>{
    if(!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null; render();
  };
}

/* ================== ความคืบหน้าของบท ================== */
const unitsOf = (lv)=> COURSE.filter(u => u.level === lv);
const scenesOf = (lv)=> SCENES.filter(sc => sc.level === lv);
function levelPct(lv){
  const us = unitsOf(lv);
  if(!us.length) return 0;
  return Math.round(us.reduce((a,u)=>a+unitPct(u),0) / us.length);
}
function unitPct(u){
  let seen=0, strong=0;
  u.words.forEach((w,i)=>{ const c=S.srs[cardKey(u,i)]; if(c){ seen++; if(c.box>=2) strong++; } });
  return Math.round((seen/u.words.length)*55 + (strong/u.words.length)*45);
}
function nextUnit(){
  const inLevel = unitsOf(S.level || "L1");
  for(const u of inLevel){ if(unitPct(u) < 80) return u; }
  for(const u of COURSE){ if(unitPct(u) < 80) return u; }
  return inLevel[0] || COURSE[0];
}

/* ================== ตัวช่วยแสดง "การ์ดพูด" ================== */
function speakCard(cfg){
  /* cfg: {label, promptHtml, target, autoPlay, top, onDone(ok,score)} */
  const typing = !SR_OK;
  scr().innerHTML = (cfg.top||"") + `
    <div class="card">
      <span class="steplabel">${esc(cfg.label)}</span>
      ${cfg.promptHtml}
      <div class="row">
        <button class="btn sm" id="pPlay">🔊 ฟัง</button>
        <button class="btn sm" id="pSlow">🐢 ช้าๆ</button>
        <button class="btn sm" id="pMode">${typing?"🎤 ใช้เสียง":"⌨️ พิมพ์แทน"}</button>
      </div>
      <div id="micArea" style="margin-top:6px"></div>
      <div id="fb"></div>
      <div class="row" id="navRow">
        <button class="btn ghost sm" id="pSkip">ข้าม / ดูเฉลย</button>
      </div>
    </div>`;
  let mode = typing ? "type" : "mic";
  const micArea = $("#micArea"), fb = $("#fb");

  function drawInput(){
    if(mode==="mic"){
      micArea.innerHTML = `<button class="mic" id="micBtn" aria-label="กดเพื่อพูด">🎤</button>
        <div class="center small muted" id="micHint">กดปุ่มไมค์ แล้วพูดออกมาดังๆ</div>`;
      $("#micBtn").addEventListener("click", startMic);
    }else{
      micArea.innerHTML = `<input type="text" id="typeIn" placeholder="พิมพ์ประโยคภาษาอังกฤษที่นี่" autocomplete="off" autocapitalize="off">
        <div class="row"><button class="btn primary" id="typeGo">ตรวจคำตอบ</button></div>`;
      $("#typeGo").addEventListener("click", ()=>judge([$("#typeIn").value]));
      $("#typeIn").addEventListener("keydown", e=>{ if(e.key==="Enter") judge([$("#typeIn").value]); });
      $("#typeIn").focus();
    }
  }
  function startMic(){
    const btn = $("#micBtn"); btn.classList.add("listening"); btn.textContent = "⏹";
    $("#micHint").textContent = "กำลังฟัง... พูดเลย";
    listen(
      (alts)=>{ btn.classList.remove("listening"); btn.textContent="🎤"; judge(alts); },
      (err)=>{ btn.classList.remove("listening"); btn.textContent="🎤";
               fb.innerHTML = `<div class="feedback mid">${esc(micErrText(err))}</div>`; },
      ()=>{ btn.classList.remove("listening"); btn.textContent="🎤"; $("#micHint").textContent="กดปุ่มไมค์ แล้วพูดออกมาดังๆ"; }
    );
  }
  function judge(alts){
    const {score, text} = bestScore(cfg.target, alts);
    const ok = score >= 70;
    const cls = score>=85 ? "good" : score>=60 ? "mid" : "bad";
    const head = score>=85 ? "เยี่ยมมาก! ออกเสียงชัดเลย 🎉"
               : score>=70 ? "ดีแล้ว! ใช้ได้เลย 👍"
               : score>=45 ? "เกือบแล้ว ลองฟังแล้วพูดตามอีกครั้ง"
               : "ยังไม่ตรง ลองกด 🐢 ฟังช้าๆ แล้วพูดตามทีละคำ";
    fb.innerHTML = `<div class="feedback ${cls}">${head} (${score}%)
        <div class="heard">แอปได้ยินว่า: “${esc(text||"—")}”</div></div>`
      + (ok && score >= 95 ? "" : coachHtml(cfg.target, text));
    const coachBox = fb.querySelector(".coach");
    if(coachBox){
      const tools = el(`<div class="row" style="margin-top:10px">
          <button class="btn sm" id="cWord">🔤 ฟังทีละคำ</button>
          <button class="btn sm" id="cSlow">🐢 ฟังช้าๆ ทั้งประโยค</button>
        </div>`);
      coachBox.appendChild(tools);
      tools.querySelector("#cWord").onclick = ()=>playWordByWord(cfg.target, coachBox);
      tools.querySelector("#cSlow").onclick = ()=>speak(cfg.target, true);
    }
    micArea.innerHTML = "";
    $("#navRow").innerHTML = "";
    const again = el(`<button class="btn sm">🔁 ลองใหม่</button>`);
    again.addEventListener("click", ()=>{ fb.innerHTML=""; $("#navRow").innerHTML=""; $("#navRow").appendChild(againNext()); drawInput(); });
    const next = el(`<button class="btn primary">${ok?"ต่อไป":"ผ่านไปก่อน"} →</button>`);
    next.addEventListener("click", ()=>cfg.onDone(ok, score));
    $("#navRow").append(again, next);
    if(ok) addXP(1);
    S.totalSpoken = (S.totalSpoken||0)+1; save();
  }
  function againNext(){
    const b = el(`<button class="btn ghost sm">ข้าม / ดูเฉลย</button>`);
    b.addEventListener("click", ()=>{
      fb.innerHTML = `<div class="feedback mid">เฉลย: “${esc(cfg.target)}”</div>`;
      speak(cfg.target, true);
      $("#navRow").innerHTML = "";
      const n = el(`<button class="btn primary">ต่อไป →</button>`);
      n.addEventListener("click", ()=>cfg.onDone(false, 0));
      $("#navRow").appendChild(n);
    });
    return b;
  }
  $("#pPlay").addEventListener("click", ()=>speak(cfg.target));
  $("#pSlow").addEventListener("click", ()=>speak(cfg.target, true));
  $("#pMode").addEventListener("click", ()=>{
    mode = mode==="mic" ? "type" : "mic";
    $("#pMode").textContent = mode==="mic" ? "⌨️ พิมพ์แทน" : "🎤 ใช้เสียง";
    fb.innerHTML=""; drawInput();
  });
  $("#pSkip").replaceWith(againNext());
  drawInput();
  if(cfg.autoPlay) setTimeout(()=>speak(cfg.target), 250);
}
</script>

<script>
/* ================== เครื่องยนต์บทเรียน ================== */
let L = null; /* {u, tasks, pos} */

function buildTasks(u){
  const tasks = [];
  const idxs = u.words.map((w,i)=>({w,i}));
  for(let c=0;c<idxs.length;c+=4){
    const chunk = idxs.slice(c,c+4);
    chunk.forEach(x=>tasks.push({t:"learn", ...x}));
    shuffle(chunk).forEach(x=>tasks.push({t:"shadow", ...x}));
  }
  shuffle(idxs).slice(0,6).forEach(x=>tasks.push({t:"choose", ...x}));
  shuffle(idxs).slice(0,6).forEach(x=>tasks.push({t:"produce", ...x}));
  tasks.push({t:"dlgIntro"});
  u.dialog.lines.forEach((line,idx)=>tasks.push({t: line.who==="You" ? "roleplay" : "listenline", idx, line}));
  tasks.push({t:"finish"});
  return tasks;
}
function startLesson(u){
  L = {u, tasks:buildTasks(u), pos:0, right:0, total:0};
  nav("lesson");
}
function stepOn(ok){
  if(ok) L.right++;
  L.total++;
  L.pos++;
  render();
}
function viewLesson(){
  if(!L){ nav("home"); return; }
  const u = L.u, task = L.tasks[L.pos];
  setTitle(u.emoji + " " + u.title, `ข้อ ${Math.min(L.pos+1, L.tasks.length)} จาก ${L.tasks.length}`, true);
  if(!task){ nav("home"); return; }

  const pct = Math.round(L.pos/L.tasks.length*100);
  const top = `<div class="lesson-top"><div class="bar"><i style="width:${pct}%"></i></div><span class="tiny muted">${pct}%</span></div>`;

  if(task.t === "learn"){
    const w = task.w;
    scr().innerHTML = top + `
      <div class="card">
        <span class="steplabel">ขั้นที่ 1 · รู้จักคำ</span>
        <div class="word-en">${esc(w.en)}</div>
        <div class="word-ph">อ่านว่า: ${esc(w.ph)}</div>
        <div class="word-th">แปลว่า: ${esc(w.th)}</div>
        <div class="ex">
          <div class="en">${esc(w.ex)}</div>
          <div class="th">${esc(w.exth)}</div>
        </div>
        <div class="row">
          <button class="btn sm" id="pl">🔊 ฟัง</button>
          <button class="btn sm" id="sl">🐢 ช้าๆ</button>
          <button class="btn sm" id="ple">🔊 ทั้งประโยค</button>
        </div>
        <div class="row"><button class="btn primary wide" id="nx">เข้าใจแล้ว ต่อไป →</button></div>
      </div>`;
    $("#pl").onclick = ()=>speak(w.en);
    $("#sl").onclick = ()=>speak(w.en, true);
    $("#ple").onclick = ()=>speak(w.ex);
    $("#nx").onclick = ()=>{ L.pos++; render(); };
    setTimeout(()=>speak(w.en), 250);
    return;
  }

  if(task.t === "shadow"){
    const w = task.w;
    speakCard({
      label:"ขั้นที่ 2 · พูดตาม",
      autoPlay:true, top,
      target:w.en,
      promptHtml:`<div class="word-en">${esc(w.en)}</div>
                  <div class="word-ph">อ่านว่า: ${esc(w.ph)}</div>
                  <div class="small muted" style="margin-top:6px">${esc(w.th)}</div>`,
      onDone:(ok)=>{ grade(u, task.i, ok); stepOn(ok); }
    });
    return;
  }

  if(task.t === "choose"){
    const w = task.w;
    const wrong = shuffle(u.words.filter(x=>x.th!==w.th)).slice(0,3);
    const opts = shuffle([w, ...wrong]);
    scr().innerHTML = top + `
      <div class="card">
        <span class="steplabel">ขั้นที่ 3 · ฟังแล้วเลือก</span>
        <div style="font-size:16px; font-weight:700; margin-bottom:4px">ฟังเสียง แล้วเลือกคำแปลที่ถูก</div>
        <div class="row"><button class="btn" id="pl">🔊 ฟังอีกครั้ง</button><button class="btn" id="sl">🐢 ช้าๆ</button></div>
        <div style="margin-top:14px" id="opts"></div>
        <div id="fb"></div>
      </div>`;
    $("#pl").onclick = ()=>speak(w.en);
    $("#sl").onclick = ()=>speak(w.en, true);
    const box = $("#opts");

      const b = el(`<button class="choice">${esc(o.th)}</button>`);

        grade(u, task.i, ok); if(ok) addXP(1);
        $("#fb").innerHTML = `<div class="feedback ${ok?"good":"bad"}">${ok?"ถูกต้อง! 🎉":"ยังไม่ใช่นะ"} — <b>${esc(w.en)}</b> = ${esc(w.th)}</div>`;

      target:w.en,

                  <div class="word-en" style="font-size:26px">${esc(w.th)}</div>
                  <div class="small muted" style="margin-top:8px">ใบ้: ${esc(w.ph)}</div>`,
      onDone:(ok)=>{ grade(u, task.i, ok); stepOn(ok); }
    });
    return;
  }

  if(task.t === "dlgIntro"){
    scr().innerHTML = top + `
      <div class="card">
        <span class="steplabel">ขั้นที่ 5 · บทสนทนา</span>
        <div style="font-size:18px; font-weight:800">${esc(u.dialog.title)}</div>
        <div class="small muted" style="margin-bottom:8px">อ่านทั้งบทก่อน 1 รอบ แล้วเดี๋ยวคุณจะได้สวมบทเป็น “You” พูดเอง</div>
        <div id="lines"></div>
        <div class="row"><button class="btn" id="playAll">🔊 ฟังทั้งบท</button></div>
        <div class="row"><button class="btn primary wide" id="nx">พร้อมแล้ว เริ่มพูดเลย →</button></div>
      </div>`;
    const lc = $("#lines");
    u.dialog.lines.forEach(ln=>{
      const b = el(`<div class="dlg-line"><div class="who ${ln.who==="You"?"you":""}">${ln.who==="You"?"คุณ":"เขา"}</div>
        <div class="t"><div class="en">${esc(ln.en)}</div><div class="th">${esc(ln.th)}</div></div></div>`);
      b.onclick = ()=>speak(ln.en);
      lc.appendChild(b);
    });
    $("#playAll").onclick = ()=>{
      let i=0;
      const go = ()=>{ if(i>=u.dialog.lines.length) return;
        const t = u.dialog.lines[i++].en;
        speak(t);
        setTimeout(go, Math.max(1600, t.length*95));
      };
      go();
    };
    $("#nx").onclick = ()=>{ L.pos++; render(); };
    return;
  }

  if(task.t === "listenline" || task.t === "roleplay"){
    const hist = u.dialog.lines.slice(0, task.idx).map(ln=>
      `<div class="msg ${ln.who==="You"?"me":"bot"}">${esc(ln.en)}<span class="th">${esc(ln.th)}</span></div>`).join("");
    if(task.t === "listenline"){
      scr().innerHTML = top + `
        <div class="card">
          <span class="steplabel">บทสนทนา · ฟังเขาพูด</span>
          <div class="chat">${hist}
            <div class="msg bot">${esc(task.line.en)}<span class="th">${esc(task.line.th)}</span></div></div>
          <div class="row"><button class="btn sm" id="pl">🔊 ฟังอีกครั้ง</button><button class="btn sm" id="sl">🐢 ช้าๆ</button></div>
          <div class="row"><button class="btn primary wide" id="nx">ต่อไป →</button></div>
        </div>`;
      $("#pl").onclick = ()=>speak(task.line.en);
      $("#sl").onclick = ()=>speak(task.line.en, true);
      $("#nx").onclick = ()=>{ L.pos++; render(); };
      setTimeout(()=>speak(task.line.en), 250);
      return;
    }
    speakCard({
      label:"บทสนทนา · ตาคุณพูด",
      autoPlay:false, top,
      target:task.line.en,
      promptHtml:`<div class="chat">${hist}</div>
        <div class="hintbox">พูดว่า: ${esc(task.line.th)}</div>
        <details style="margin-top:8px"><summary class="small muted" style="cursor:pointer">💡 ขอดูประโยคภาษาอังกฤษ</summary>
        <div style="font-size:18px; font-weight:700; margin-top:6px">${esc(task.line.en)}</div></details>`,
      onDone:(ok)=>{ stepOn(ok); }
    });
    return;
  }

  if(task.t === "finish"){
    const pctScore = L.total ? Math.round(L.right/L.total*100) : 0;
    const un = S.units[u.id] || {};
    un.done = true; un.times = (un.times||0)+1; un.best = Math.max(un.best||0, pctScore);
    S.units[u.id] = un; save();
    scr().innerHTML = `
      <div class="card center">

        </div>
        <div class="small muted" style="margin-top:12px">แอปจะเอาคำเหล่านี้กลับมาให้ทบทวนในวันถัดๆ ไป ตอนที่คุณกำลังจะลืมพอดี — อย่าลืมเข้ามาทุกวันนะครับ</div>
        <div class="row" style="margin-top:14px">
          <button class="btn" id="again">เรียนบทนี้ซ้ำ</button>

      </div>`;
    $("#again").onclick = ()=>startLesson(u);
    $("#talk").onclick = ()=>nav("talk");
    $("#home").onclick = ()=>nav("home");
    return;
  }
}

/* ================== ติวเตอร์ตอบคำถามที่ผู้เรียนถามเอง ==================
   ไม่ได้ใช้ AI บนเซิร์ฟเวอร์ — จับใจความจากคำสำคัญในคำถาม แล้วเลือกคำตอบที่ตรงที่สุด
   ลำดับการค้นหา: คำถามเฉพาะฉากที่กำลังคุยอยู่ → คลังคำตอบกลาง → คำถามพิเศษ → เดาจากคำขึ้นต้น */

const QUESTION_WORDS = ["what","where","when","who","why","how","which","whose"];
const QUESTION_AUX   = ["do","does","did","can","could","are","is","am","was","were",
                        "will","would","have","has","should","may","shall"];

/* “What does ___ mean?” — ค้นคำแปลจากคำศัพท์ทั้ง 300 ประโยคในหลักสูตร */
function lookupMeaning(text){
  const n = norm(text);
  const m = n.match(/what does (.+?) mean/) || n.match(/what is the meaning of (.+)/)
         || n.match(/what means (.+)/) || n.match(/meaning of (.+)/);
  if(!m) return null;
  const term = m[1].trim();
  if(!term) return null;
  let hit = null;
  COURSE.forEach(u => u.words.forEach(w=>{
    const en = norm(w.en);
    if(en === term) hit = hit || w;
    else if(!hit && en.split(" ").includes(term) && norm(w.en).split(" ").length <= 3) hit = w;
  }));
  if(!hit) UPGRADES.forEach(x=>{ if(!hit && norm(x.native).includes(term) && term.length > 3) hit = {en:x.native, th:x.th}; });
  if(hit) return { a:`“${hit.en}” means: ${hit.th}`, ath:`“${hit.en}” แปลว่า ${hit.th}`, found:true };
  return { a:`Sorry, “${term}” is not in our lessons yet.`,
           ath:`ขอโทษค่ะ คำว่า “${term}” ยังไม่มีในบทเรียน ลองถามคำอื่นดูนะ`, found:false };
}

function matchList(list, words, text){
  let best = null, bestScore = 0;
  (list || []).forEach(item=>{
    (item.keys || []).forEach(k=>{
      if(k.length && k.every(x => words.includes(x))){
        /* ชุดคำที่ยาวกว่าได้เปรียบบ้าง แต่ความเหมือนกับรูปคำถามจริงสำคัญกว่า
           ไม่งั้น “How old are you?” จะถูก “How are you?” คว้าไปตอบ */
        const sc = k.length * 3 + scoreSpeech(item.q || item.a, text) / 4;
        if(sc > bestScore){ bestScore = sc; best = item; }
      }
    });
  });
  return best;
}

/* ctx = { scene, turn, lastBot }  (ไม่มีก็ได้ ถ้าถามนอกบทสนทนา) */
function answerQuestion(text, ctx){
  ctx = ctx || {};
  const words = norm(text).split(" ").filter(Boolean);
  if(!words.length) return { a:"I did not hear anything.", ath:"ไม่ได้ยินเสียงเลยค่ะ", kind:"none" };

  const meaning = lookupMeaning(text);
  if(meaning) return { ...meaning, kind:"meaning" };

  const isQuestion = QUESTION_WORDS.includes(words[0]) || QUESTION_AUX.includes(words[0])
                     || /\?$/.test(String(text).trim());

  /* ประโยคบอกเล่าห้ามไปคว้าคำตอบของคำถามมาตอบ
     ยกเว้นวลีที่ตอบได้อยู่แล้วอย่าง “Thank you” หรือ “See you” (ทำเครื่องหมาย stmt ไว้) */
  const pool = isQuestion ? ASKS : ASKS.filter(a => a.stmt);
  const sceneHit = isQuestion && ctx.scene && matchList(ctx.scene.qa, words, text);
  if(sceneHit) return { ...sceneHit, kind:"scene" };

  const hit = matchList(pool, words, text);
  if(hit){
    const out = { a:hit.a, ath:hit.ath, q:hit.q, kind:"known", act:hit.act };
    if(hit.act === "hint" && ctx.turn)
      out.a = `You can say: “${ctx.turn.model}”`, out.ath = `พูดว่า “${ctx.turn.model}” — ${ctx.turn.modelTh}`;
    if(hit.act === "repeat" && ctx.lastBot)
      out.a = ctx.lastBot, out.ath = "ฟังอีกครั้งนะคะ";
    return out;
  }

  /* ไม่เจอในคลัง */
  if(!isQuestion)
    return { kind:"notquestion",
      a:"That sounds more like a sentence than a question.",
      ath:"อันนี้ฟังดูเหมือนประโยคบอกเล่า ไม่ใช่คำถาม — คำถามต้องขึ้นต้นด้วย What / Where / How / Do you / Can you" };

  const generic = {
    what:  { a:"Hmm, that is a good question. I am not sure about that one!", ath:"อืม เป็นคำถามที่ดีนะ แต่ฉันไม่แน่ใจเรื่องนั้น" },
    where: { a:"I am not sure where. Maybe you can look it up?", ath:"ไม่แน่ใจว่าที่ไหน ลองหาข้อมูลดูนะ" },
    when:  { a:"I do not know exactly when, sorry!", ath:"ไม่รู้แน่ชัดว่าเมื่อไหร่ ขอโทษนะ" },
    why:   { a:"That is an interesting question. What do you think?", ath:"เป็นคำถามที่น่าสนใจ แล้วคุณคิดว่ายังไงล่ะ" },
    how:   { a:"There are many ways. Practice is the most important one!", ath:"มีหลายวิธี แต่การฝึกฝนสำคัญที่สุด" },
    who:   { a:"I am not sure who, sorry.", ath:"ไม่แน่ใจว่าใคร ขอโทษนะ" }
  }[words[0]] || { a:"Good question! I do not know the answer to that one.", ath:"คำถามดีนะ แต่ฉันไม่รู้คำตอบเรื่องนั้น" };
  return { ...generic, kind:"generic" };
}

/* ตรวจว่าคำถามที่ผู้เรียนพูด ถูกรูปประโยคคำถามไหม ถ้าไม่ ให้แก้เป็นภาษาไทย */
function checkQuestionForm(text, matched){
  const words = norm(text).split(" ").filter(Boolean);
  if(!words.length) return null;
  const startsRight = QUESTION_WORDS.includes(words[0]) || QUESTION_AUX.includes(words[0]);

  if(matched && matched.q && scoreSpeech(matched.q, text) < 80)
    return { fix: matched.q,
      why: startsRight ? "เข้าใจแล้ว แต่ประโยคคำถามที่ถูกต้องคือแบบนี้"
                       : "ประโยคคำถามภาษาอังกฤษต้องขึ้นต้นด้วยคำถามหรือกริยาช่วย" };

  if(!startsRight)
    return { fix:null,
      why:"ประโยคคำถามต้องขึ้นต้นด้วย What / Where / When / Why / How หรือ Do you / Can you / Are you" };

  return null;
}

/* ================== หน้าคุยกับติวเตอร์ ================== */
/* ตรวจคำตอบแบบเข้มงวด: ต้องมีโครงประโยคที่ถูกต้อง ไม่ใช่แค่พูดยาวๆ แล้วผ่าน */
function judgeTurn(said, t){
  const n = norm(said);
  const w = n.split(" ").filter(Boolean);
  const sim = scoreSpeech(t.model, said);
  if(!w.length) return {r:"empty", sim:0};

  const frames = (t.need || []).filter(f => f.length);
  const frame  = frames.find(f => f.every(x => w.includes(x)));
  const frameOk = frames.length === 0 || !!frame;
  const oneOfOk = !t.oneOf || t.oneOf.some(x => w.includes(x));
  const used = frame ? frame.length : 0;
  const extraOk = !t.extra || (w.length - used) >= t.extra;

  if(frameOk && oneOfOk && extraOk) return {r:"ok", sim};
  if(sim >= 65) return {r:"ok", sim};          /* พูดตรงกับประโยคตัวอย่างมาก ก็ถือว่าผ่าน */

  /* ผิดตรงไหน บอกให้ชัด */
  let why;
  if(!oneOfOk)      why = "ยังไม่ได้บอกตัวเลขหรือเวลา";
  else if(!frameOk) why = frames.length ? `ยังไม่มีคำว่า “${frames[0].join(" ")}”` : "ยังไม่ตรงกับที่ถาม";
  else if(!extraOk) why = "ตอบสั้นไป ต้องบอกรายละเอียดด้วย";
  else              why = "ยังไม่ตรงกับที่ถาม";

  return { r: (sim >= 35 || frameOk) ? "close" : "no", sim, why };
}

}

/* ---------- หน้าคุยจริง ---------- */
function talkScene(){
  const sc = T.scene, turn = sc.turns[T.pos];

  if(!turn){ talkSummary(); return; }

  const pct = Math.round(T.pos / sc.turns.length * 100);
  scr().innerHTML = `
    <div class="lesson-top"><div class="bar"><i style="width:${pct}%"></i></div>
      <span class="tiny muted">ตาที่ ${T.pos+1}/${sc.turns.length}</span></div>
    <div class="card"><div class="chat" id="chat"></div></div>
    <div class="card" id="panel"></div>`;

  const chat = $("#chat");
  const push = (m)=>{
    if(m.who === "sys"){ chat.appendChild(el(`<div class="msg sys">${esc(m.en)}</div>`)); return; }
    const b = el(`<div class="msg ${m.who}">${esc(m.en)}${m.th ? `<span class="th">${esc(m.th)}</span>` : ""}</div>`);
    if(m.who === "bot") b.onclick = ()=>speak(m.en);
    chat.appendChild(b);
  };
  T.msgs.forEach(push);

  /* ติวเตอร์พูดประโยคของเทิร์นนี้ (ถ้ามี) */
  if(turn.bot && !T.msgs.some(m => m.en === turn.bot && m.who === "bot")){
    const m = {who:"bot", en:turn.bot, th:turn.botTh};
    T.msgs.push(m); push(m);
    setTimeout(()=>speak(turn.bot), 300);
  }
  chat.lastElementChild && chat.lastElementChild.scrollIntoView({block:"nearest"});

  const panel = $("#panel");
  panel.innerHTML = `
    <div class="hintbox">${turn.askBack ? "❓ <b>ตาคุณถาม</b> — " : "🎤 <b>ตาคุณตอบ</b> — "}${esc(turn.say)}</div>
    <div class="row">
      ${turn.bot ? `<button class="btn sm" id="rep">🔊 ฟังอีกครั้ง</button>` : ""}
      <button class="btn sm" id="hint">💡 ใบ้</button>
      <button class="btn sm" id="mode">⌨️ พิมพ์</button>
      <button class="btn sm ghost" id="skip">⏭ ข้าม</button>
    </div>
    <div class="row"><button class="btn sm wide" id="askBtn">❓ ถามติวเตอร์เอง (ถามอะไรก็ได้)</button></div>
    <div id="hintBox"></div>
    <div id="input"></div>
    <div id="fb"></div>`;

  if($("#rep")) $("#rep").onclick = ()=>speak(turn.bot);
  $("#hint").onclick = ()=>{
    $("#hintBox").innerHTML = `<div class="hintbox" style="margin-top:8px">
      พูดว่า: “${esc(turn.model)}”<br><span class="small">${esc(turn.modelTh)}</span></div>`;
    speak(turn.model, true);
  };
  $("#skip").onclick = ()=>{ T.total++; nextTurn(); };
  $("#askBtn").onclick = ()=>{
    const lastBot = [...T.msgs].reverse().find(m => m.who === "bot");
    askPanel({
      ctx: { scene: sc, turn, lastBot: lastBot && lastBot.en },
      onAsk: (q, ans)=>{
        T.msgs.push({who:"me", en:q});
        T.msgs.push({who:"bot", en:ans.a, th:ans.ath});
      },
      onClose: ()=>render()
    });
  };

  let typing = !SR_OK;
  $("#mode").onclick = ()=>{ typing = !typing; $("#mode").textContent = typing ? "🎤 เสียง" : "⌨️ พิมพ์"; drawInput(); };
  drawInput();

  function drawInput(){
    const box = $("#input");
    if(typing){
      box.innerHTML = `<input type="text" id="tin" placeholder="พิมพ์ประโยคภาษาอังกฤษ" autocomplete="off" autocapitalize="off">
        <div class="row"><button class="btn primary" id="tgo">ส่งคำตอบ</button></div>`;
      $("#tgo").onclick = ()=>handle($("#tin").value, [$("#tin").value]);
      $("#tin").onkeydown = (e)=>{ if(e.key === "Enter") handle($("#tin").value, [$("#tin").value]); };
    }else{
      box.innerHTML = `<button class="mic" id="micBtn">🎤</button>
        <div class="center small muted" id="mh">กดไมค์ แล้วพูดเป็นภาษาอังกฤษ</div>`;
      $("#micBtn").onclick = ()=>{
        const btn = $("#micBtn");
        btn.classList.add("listening"); btn.textContent = "⏹"; $("#mh").textContent = "กำลังฟัง...";
        listen(
          (alts)=>{ btn.classList.remove("listening"); btn.textContent = "🎤"; handle(alts[0] || "", alts); },
          (err)=>{ btn.classList.remove("listening"); btn.textContent = "🎤";
                   $("#fb").innerHTML = `<div class="feedback mid">${esc(micErrText(err))}</div>`; },
          ()=>{ btn.classList.remove("listening"); btn.textContent = "🎤";
                $("#mh").textContent = "กดไมค์ แล้วพูดเป็นภาษาอังกฤษ"; }
        );
      };
    }
  }

  function handle(text, alts){
    text = String(text || "").trim();
    if(!text) return;

    /* เลือกคำตอบที่ดีที่สุดจากหลายตัวเลือกที่เครื่องได้ยิน */
    const rank = {ok:3, close:2, no:1, empty:0};
    let best = null, bestText = text;
    (alts || [text]).forEach(a=>{
      const j = judgeTurn(a, turn);
      if(!best || rank[j.r] > rank[best.r] || (rank[j.r] === rank[best.r] && j.sim > best.sim)){
        best = j; bestText = a;
      }
    });
    if(!best) best = judgeTurn(text, turn);

    T.msgs.push({who:"me", en:bestText});

    if(best.r === "ok"){
      T.right++; T.total++; addXP(1);
      S.totalSpoken = (S.totalSpoken||0) + 1; save();
      const reply = turn.askBack ? turn.botReply : turn.ok;
      const replyTh = turn.askBack ? turn.botReplyTh : turn.okTh;
      if(reply) T.msgs.push({who:"bot", en:reply, th:replyTh});
      T.tries = 0;
      render();
      if(reply) setTimeout(()=>speak(reply), 250);
      setTimeout(()=>{ T.pos++; render(); }, reply ? Math.max(1800, reply.length*75) : 500);
      return;
    }

    /* ตอบยังไม่ถูก — ไม่ผ่าน และไม่ไปข้อถัดไป */
    T.tries++;
    S.totalSpoken = (S.totalSpoken||0) + 1; save();
    const lastTry = T.tries >= 2;
    const head = best.r === "close" ? "เกือบแล้ว!" : "ยังไม่ใช่นะครับ";
    T.msgs.push({who:"sys", en:`❌ ${head} ${best.why || ""}`});
    render();

    const fb = $("#fb");
    fb.innerHTML = `<div class="feedback ${best.r === "close" ? "mid" : "bad"}">
        ${head} ${esc(best.why || "")}
        <div class="heard">แอปได้ยินว่า: “${esc(bestText)}” (ตรง ${best.sim}%)</div>
        ${lastTry ? `<div class="heard">ประโยคที่ถูกคือ: “${esc(turn.model)}” — ${esc(turn.modelTh)}</div>` : ""}
      </div>`
      + coachHtml(turn.model, bestText);
    const cb = fb.querySelector(".coach");
    if(cb){
      const tools = el(`<div class="row" style="margin-top:10px">
          <button class="btn sm" id="tWord">🔤 ฟังทีละคำ</button>
          <button class="btn sm" id="tSlow">🐢 ฟังช้าๆ</button></div>`);
      cb.appendChild(tools);
      tools.querySelector("#tWord").onclick = ()=>playWordByWord(turn.model, cb);
      tools.querySelector("#tSlow").onclick = ()=>speak(turn.model, true);
    }
    if(lastTry){
      speak(turn.model, true);
      const row = el(`<div class="row"></div>`);
      const again = el(`<button class="btn">🔁 พูดตามประโยคนี้</button>`);
      again.onclick = ()=>{ T.tries = 1; fb.innerHTML = ""; };
      const nx = el(`<button class="btn primary">ตาต่อไป →</button>`);
      nx.onclick = ()=>{ T.total++; nextTurn(); };
      row.append(again, nx);
      fb.appendChild(row);
    }else{
      const row = el(`<div class="row"><button class="btn primary wide">ลองใหม่อีกครั้ง</button></div>`);
      row.firstElementChild.onclick = ()=>{ fb.innerHTML = ""; };
      fb.appendChild(row);
    }
  }

  function nextTurn(){ T.tries = 0; T.pos++; render(); }
}

/* ---------- แผง "ถามติวเตอร์เอง": ผู้เรียนถามอะไรก็ได้ ติวเตอร์ตอบ ---------- */
function askPanel(cfg){
  const log = [];
  const cats = [...new Set(ASKS.map(a => a.cat))];
  let typing = !SR_OK, cat = cats[0];

  function draw(){
    setTitle("ถามติวเตอร์", "ถามอะไรก็ได้ แอนนาจะตอบให้", true);
    scr().innerHTML = `
      <div class="card">
        <div class="chat" id="qchat">
          ${log.length ? "" : `<div class="msg sys">ลองถามอะไรก็ได้เป็นภาษาอังกฤษ เช่น “Where are you from?”<br>ถ้านึกไม่ออก กดคำถามตัวอย่างด้านล่างได้เลย</div>`}
        </div>
      </div>
      <div class="card">
        <div class="row">
          <button class="btn sm" id="qmode">${typing ? "🎤 เสียง" : "⌨️ พิมพ์"}</button>
          <button class="btn sm ghost" id="qdone">${cfg.ctx && cfg.ctx.turn ? "↩ กลับไปคุยต่อ" : "✕ ปิด"}</button>
        </div>
        <div id="qinput"></div>
        <div id="qfb"></div>
      </div>
      <div class="sect-title">คำถามตัวอย่าง — กดเพื่อถามได้เลย</div>
      <div id="qcats" class="levelbar" style="flex-wrap:wrap"></div>
      <div id="qlist"></div>`;

    const chat = $("#qchat");
    log.forEach(m=>{
      const b = el(`<div class="msg ${m.who}">${esc(m.en)}${m.th ? `<span class="th">${esc(m.th)}</span>` : ""}</div>`);
      if(m.who === "bot") b.onclick = ()=>speak(m.en);
      chat.appendChild(b);
    });

    const cb = $("#qcats");
    cats.forEach(c=>{
      const b = el(`<button class="lvbtn ${c===cat?"on":""}" style="flex:0 0 auto; padding:8px 12px"><span class="lvn">${esc(c)}</span></button>`);
      b.onclick = ()=>{ cat = c; draw(); };
      cb.appendChild(b);
    });
    const list = $("#qlist");
    ASKS.filter(a => a.cat === cat).forEach(a=>{
      const b = el(`<button class="unit" style="padding:10px 12px">
          <div class="meta"><b style="font-size:14.5px">${esc(a.q)}</b><span>${esc(a.qth)}</span></div>
          <div class="tiny muted">ถาม</div></button>`);
      b.onclick = ()=>{ speak(a.q); ask(a.q, [a.q]); };
      list.appendChild(b);
    });

    $("#qmode").onclick = ()=>{ typing = !typing; draw(); };
    $("#qdone").onclick = ()=>{ cfg.onClose && cfg.onClose(); };
    drawInput();
  }

  function drawInput(){
    const box = $("#qinput");
    if(typing){
      box.innerHTML = `<input type="text" id="qin" placeholder="พิมพ์คำถามภาษาอังกฤษ เช่น Where are you from?" autocomplete="off" autocapitalize="off">
        <div class="row"><button class="btn primary" id="qgo">ถาม</button></div>`;
      $("#qgo").onclick = ()=>ask($("#qin").value, [$("#qin").value]);
      $("#qin").onkeydown = (e)=>{ if(e.key === "Enter") ask($("#qin").value, [$("#qin").value]); };
    }else{
      box.innerHTML = `<button class="mic" id="qmic">🎤</button>
        <div class="center small muted" id="qh">กดไมค์ แล้วถามเป็นภาษาอังกฤษ</div>`;
      $("#qmic").onclick = ()=>{
        const btn = $("#qmic");
        btn.classList.add("listening"); btn.textContent = "⏹"; $("#qh").textContent = "กำลังฟัง...";
        listen(
          (alts)=>{ btn.classList.remove("listening"); btn.textContent = "🎤"; ask(alts[0] || "", alts); },
          (err)=>{ btn.classList.remove("listening"); btn.textContent = "🎤";
                   $("#qfb").innerHTML = `<div class="feedback mid">${esc(micErrText(err))}</div>`; },
          ()=>{ btn.classList.remove("listening"); btn.textContent = "🎤";
                $("#qh").textContent = "กดไมค์ แล้วถามเป็นภาษาอังกฤษ"; }
        );
      };
    }
  }

  function ask(text, alts){
    text = String(text || "").trim();
    if(!text) return;

    /* เลือกตัวเลือกที่เครื่องได้ยินซึ่งตรงคลังคำตอบมากที่สุด */
    let ans = null, used = text;
    (alts || [text]).forEach(a=>{
      const r = answerQuestion(a, cfg.ctx);
      const rank = { meaning:4, scene:4, known:3, generic:2, notquestion:1, none:0 };
      if(!ans || rank[r.kind] > rank[ans.kind]){ ans = r; used = a; }
    });

    log.push({ who:"me", en:used });
    log.push({ who:"bot", en:ans.a, th:ans.ath });
    S.totalSpoken = (S.totalSpoken || 0) + 1;
    if(ans.kind === "known" || ans.kind === "scene" || ans.kind === "meaning") addXP(1);
    save();
    if(cfg.onAsk) cfg.onAsk(used, ans);
    draw();

    setTimeout(()=>speak(ans.a, ans.act === "slow"), 250);

    /* บอกว่าคำถามที่พูดถูกรูปไหม ถ้าไม่ ให้ประโยคที่ถูกต้อง */
    const matched = ASKS.find(a => a.q === ans.q);
    const chk = checkQuestionForm(used, matched);
    const fb = $("#qfb");
    if(chk){
      fb.innerHTML = `<div class="feedback mid">${esc(chk.why)}
        ${chk.fix ? `<div class="heard">ประโยคที่ถูกคือ: “${esc(chk.fix)}”</div>` : ""}</div>`;
      if(chk.fix){
        const row = el(`<div class="row"><button class="btn sm">🔊 ฟังประโยคที่ถูก</button></div>`);
        row.firstElementChild.onclick = ()=>speak(chk.fix, true);
        fb.appendChild(row);
      }

/* ================== แบบวัดระดับ ================== */
let P = null;   /* {items, pos, right} */

function buildPlacement(){
  const pick = (lv, n)=>{
    const pool = [];
    unitsOf(lv).forEach(u => u.words.forEach((w,i)=> pool.push({u, i, w, lv})));
    return shuffle(pool).slice(0, n);
  };
  const items = [...pick("L1",3), ...pick("L2",3), ...pick("L3",3), ...pick("L4",3)];
  return items.map(it=>{
    const wrong = shuffle(COURSE.flatMap(u=>u.words).filter(w=>w.th !== it.w.th)).slice(0,3);
    return { ...it, options: shuffle([it.w, ...wrong]) };
  });
}

function viewPlacement(){
  setTitle("วัดระดับของคุณ", "12 ข้อ ไม่ถึง 2 นาที", true);
  if(!P) P = { items: buildPlacement(), pos:0, right:0, byLevel:{L1:0,L2:0,L3:0,L4:0} };
  const it = P.items[P.pos];

  if(!it){
    /* ให้ผ่านระดับหนึ่งๆ ต้องตอบถูกอย่างน้อย 2 จาก 3 ข้อของระดับนั้น */
    let rec = "L1";
    ["L1","L2","L3","L4"].forEach(lv=>{ if(P.byLevel[lv] >= 2) rec = lv; });
    const nextIdx = Math.min(3, LEVELS.findIndex(l=>l.id===rec) + (P.byLevel[rec] === 3 ? 1 : 0));
    const start = LEVELS[nextIdx] || LEVELS[0];
    const score = P.right, byLevel = P.byLevel;
    P = null;
    S.level = start.id; S.placed = true; save();
    scr().innerHTML = `
      <div class="card center">
        <div class="confetti">${start.emoji}</div>
        <h2 style="margin:8px 0 2px">คุณควรเริ่มที่ ระดับ ${start.n}</h2>
        <div style="font-size:17px; font-weight:800; color:var(--brand)">${esc(start.name)} <span class="pill">${esc(start.cefr)}</span></div>
        <div class="small muted" style="margin-top:6px">${esc(start.sub)}</div>
        <div class="small muted" style="margin-top:12px">ตอบถูก ${score} จาก 12 ข้อ</div>
        <div class="statrow">
          ${LEVELS.map(l=>`<div class="stat"><b>${byLevel[l.id]}/3</b><span>ระดับ ${l.n}</span></div>`).join("")}
        </div>
        <div class="small muted" style="margin-top:12px">
          ไม่ต้องกังวลถ้าได้ระดับต่ำ — ระดับล่างคือรากฐาน ยิ่งแน่นยิ่งไปได้ไกล
          และคุณเปลี่ยนระดับเองได้ตลอดจากแถบด้านบนหน้าแรก
        </div>
        <div class="row" style="margin-top:14px">
          <button class="btn" id="again">วัดใหม่</button>
          <button class="btn primary" id="go">ไปเรียนระดับ ${start.n}</button>
        </div>
      </div>`;
    $("#again").onclick = ()=>{ S.placed = false; save(); nav("place"); };
    $("#go").onclick = ()=>nav("home");
    return;
  }

  const pct = Math.round(P.pos / P.items.length * 100);
  scr().innerHTML = `
    <div class="lesson-top"><div class="bar"><i style="width:${pct}%"></i></div>
      <span class="tiny muted">${P.pos+1}/${P.items.length}</span></div>
    <div class="card">
      <span class="steplabel">ระดับ ${LEVELS.find(l=>l.id===it.lv).n}</span>
      <div class="small muted">ประโยคนี้แปลว่าอะไร</div>
      <div class="word-en" style="font-size:25px">${esc(it.w.en)}</div>
      <div class="row"><button class="btn sm" id="pl">🔊 ฟัง</button></div>
      <div style="margin-top:14px" id="opts"></div>
      <div id="fb"></div>
    </div>`;
  $("#pl").onclick = ()=>speak(it.w.en);
  const box = $("#opts");
  it.options.forEach(o=>{
    const b = el(`<button class="choice">${esc(o.th)}</button>`);
    b.onclick = ()=>{
      if(box.dataset.done) return;
      box.dataset.done = "1";
      const ok = o.th === it.w.th;
      b.classList.add(ok ? "right" : "wrong");
      if(!ok) [...box.children].forEach(c=>{ if(c.textContent === it.w.th) c.classList.add("right"); });
      if(ok){ P.right++; P.byLevel[it.lv]++; }
      $("#fb").innerHTML = `<div class="feedback ${ok?"good":"bad"}">${ok?"ถูกต้อง":"ที่ถูกคือ"} — <b>${esc(it.w.en)}</b> = ${esc(it.w.th)}</div>`;
      const row = el(`<div class="row"><button class="btn primary">ต่อไป →</button></div>`);
      row.firstElementChild.onclick = ()=>{ P.pos++; render(); };
      $("#fb").appendChild(row);
    };
    box.appendChild(b);
  });
}

  cats.forEach(c=>{
    const b = el(`<button class="lvbtn ${c===cat?"on":""}" style="flex:0 0 auto; padding:8px 12px"><span class="lvn">${esc(c)}</span></button>`);

      <div class="tiny muted" style="font-weight:800">สถานการณ์: ${esc(u.th)}</div>
      <div class="tier t-basic"><span class="tag">พื้นฐาน</span><b>${esc(u.basic)}</b></div>

      <div class="tier t-native"><span class="tag">เจ้าของภาษา</span><b>${esc(u.native)}</b></div>

    list.appendChild(card);
  });

  $("#drill").onclick = ()=>{ U = {drill: shuffle(UPGRADES).slice(0,10), pos:0, right:0}; render(); };
}

function upgradeDrill(){
  const it = U.drill[U.pos];
  if(!it){
    const r = U.right, n = U.drill.length;
    U = null;
    scr().innerHTML = `<div class="card center">
        <div class="confetti">🎓</div>
        <h2 style="margin:8px 0 2px">ฝึกครบแล้ว!</h2>
        <div class="small muted">พูดได้ระดับเจ้าของภาษา ${r} จาก ${n} ประโยค</div>
        <div class="row" style="margin-top:14px"><button class="btn primary wide" id="back">กลับไปดูรายการ</button></div>
      </div>`;
    $("#back").onclick = ()=>render();
    return;
  }
  const pct = Math.round(U.pos / U.drill.length * 100);
  speakCard({
    label:"พูดแบบเจ้าของภาษา",
    target: it.native,
    autoPlay: false,
    top:`<div class="lesson-top"><div class="bar"><i style="width:${pct}%"></i></div>
         <span class="tiny muted">${U.pos+1}/${U.drill.length}</span></div>`,
    promptHtml:`<div class="tiny muted" style="font-weight:800">สถานการณ์: ${esc(it.th)}</div>
      <div class="tier t-basic" style="margin-top:8px"><span class="tag">อย่าพูดแบบนี้</span><b>${esc(it.basic)}</b></div>
      <div class="small muted" style="margin-top:10px">พูดประโยคระดับเจ้าของภาษาแทน — กด 💡 ถ้าจำไม่ได้</div>
      <details style="margin-top:6px"><summary class="small muted" style="cursor:pointer">💡 ขอดูประโยค</summary>
        <div style="font-size:19px; font-weight:800; margin-top:6px; color:var(--ok)">${esc(it.native)}</div>
        <div class="upnote" style="margin-top:8px">💡 ${it.note}</div></details>`,
    onDone:(ok)=>{ if(ok){ U.right++; addXP(1); } U.pos++; render(); }
  });
}
